<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVTracker · Shows & Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Sizes: original 100% design. Breathing room comes from the side gutter (--gut), not from shrinking content. */
/* =========================================================
   TVTracker web — Shows page (desktop / tablet)
   Same design language as the app prototype: tokens, fonts, cards, posters, motion.
   ========================================================= */
:root{
  --bg:#000; --surface:#15161C; --line:rgba(var(--glass),.08);
  --amber:#FFC42E; --ink:#1C1400; --text:#F4F5F8; --heading:#F4F6FF; --muted:#9AA3BD; --dim:#C9CEDC;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Archivo","Figtree",sans-serif;
  --ease-out:cubic-bezier(.2,0,0,1); --ease-io:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r-card:16px; --r-row:14px; --r-poster:12px;
  --maxw:1600px; --gut:clamp(20px,5vw,80px); /* 1512 incl. gutters = 1440 visible content (90% of the original 1680 grid) */
  --green:#3DDC84; --purple:#9B7BFF;
  --accent-fg:var(--amber); --glass:255,255,255; --scrim:21,22,28; --bg-rgb:0,0,0; --ph:#22232b; --menu:#111217; --toast:#1d1e26;
  --surface-2:#1f2029; --muted-2:#8790a8; --toggle-off:#39393d; --green-fg:#3DDC84; --purple-fg:#9B7BFF; --red:#FF453A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-899.1px;top:8px;z-index:50;background:var(--amber);color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:700}
.skip:focus{left:12px}
.glow{position:fixed;left:-198px;top:-288px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,178,41,.07),rgba(255,178,41,0));pointer-events:none;z-index:0}

/* ---------- Site header ---------- */
.site{position:sticky;top:0;z-index:20;height:64px;background:rgba(var(--bg-rgb),.72);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.site-in{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 var(--gut);display:flex;align-items:center;gap:28px}
.brand{flex:none} .brand img{height:22px;display:block}
.mainnav{display:flex;align-items:center;gap:2px}
.mainnav a{display:flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:10px;font-size:14.6px;font-weight:600;color:var(--dim);transition:color .15s,background .15s}
.dd{position:relative}
.ddbtn{display:flex;align-items:center;gap:4px;height:36px;padding:0 12px;border:0;border-radius:10px;background:none;font:600 14.6px var(--font);color:var(--dim);cursor:pointer;transition:color .15s,background .15s}
.ddbtn:hover,.ddbtn[aria-expanded="true"]{color:var(--text);background:rgba(var(--glass),.06)}
.ddbtn svg{transition:transform .2s var(--ease-out)} .ddbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddbtn:focus-visible,.ddmenu a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ddmenu{position:absolute;left:0;top:calc(100% + 10px);z-index:30;min-width:220px;padding:10px;border-radius:16px;background:var(--menu);border:1px solid rgba(var(--glass),.1);box-shadow:0 24px 48px rgba(0,0,0,.55)}
.ddmenu[hidden]{display:none} .ddmenu.two{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr));gap:6px}
.ddmenu ul{list-style:none;margin:0;padding:0}
.ddmenu a{display:flex;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--dim)}
.mainnav .ddmenu a{height:auto;min-height:38px;padding:0 12px;font-weight:500;font-size:14px}
.ddmenu a:hover{background:rgba(var(--glass),.06);color:var(--text)}
.ddh{margin:6px 12px 4px;font-size:11.4px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mainnav a:hover{color:var(--text);background:rgba(var(--glass),.06)}
.mainnav a[aria-current="page"]{color:var(--accent-fg);background:rgba(255,196,46,.12)}
.mainnav a:focus-visible,.mnav a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.site-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.gsearch{display:flex;align-items:center;gap:8px;width:340px;height:40px;padding:0 10px 0 12px;border-radius:12px;background:rgba(var(--glass),.05);border:1px solid var(--line);color:var(--muted);transition:border-color .15s,background .15s}
.gsearch:hover{background:rgba(var(--glass),.07)}
.gsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;color:var(--text)}
.gsearch input::placeholder{color:var(--muted)}
.gsearch kbd{font:600 11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.gsearch:focus-within{border-color:rgba(255,196,46,.55);background:rgba(var(--glass),.07)}
.iconbtn{position:relative;width:40px;height:40px;border:0;border-radius:12px;background:none;display:grid;place-items:center;color:var(--dim);cursor:pointer;transition:background .15s,color .15s}
.iconbtn:hover{background:rgba(var(--glass),.06);color:var(--text)}
.iconbtn:focus-visible,.avatar:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.iconbtn .dot{position:absolute;right:9px;top:8px;width:8px;height:8px;border-radius:50%;background:#FF4D5E;box-shadow:0 0 0 2px var(--bg)}
.menubtn{display:none;margin-left:-7.2px}
.site{isolation:isolate}
.mnav{position:absolute;left:0;right:0;top:100%;display:grid;padding:8px var(--gut) 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--menu);box-shadow:0 24px 48px rgba(0,0,0,.6)}
.mnav[hidden]{display:none}
.mnav a{display:flex;align-items:center;height:48px;padding:0 12px;border-radius:12px;font-size:16px;font-weight:600;color:var(--dim)}
.mnav a[aria-current="page"]{color:var(--accent-fg);background:rgba(255,196,46,.12)}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(var(--glass),.12);background:var(--ph);color:var(--heading);font-weight:700;font-size:13px;cursor:pointer}

/* ---------- Page ---------- */
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut) 72px}

/* Page tabs = the app's underline tabs, adapted for web: left-aligned with the content, sized as the page title,
   indicator only as wide as the word, same size in both states (no layout shift). */
.toolbar{display:flex;align-items:flex-end;gap:12px;margin:28px 0 28px;border-bottom:1px solid var(--line)}
.tabs{position:relative;display:flex;gap:36px}
.tab{position:relative;border:0;background:none;padding:0 0 14px;cursor:pointer;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.2px;line-height:1.15;color:var(--muted);transition:color .2s}
.tab:hover{color:var(--dim)}
.tab[aria-selected="true"]{color:var(--accent-fg)}
.tab::after{content:"";position:absolute;inset:-7.2px -9px 0}          /* bigger hit area */
.tab:focus-visible{outline:2px solid var(--amber);outline-offset:6px;border-radius:6px}
.ind{position:absolute;left:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--amber);transition:transform .35s var(--ease-out),width .35s var(--ease-out)}
.toolbar .vbtn{margin-left:auto;margin-bottom:8px}
.sec-meta{margin:0;font-size:14px;color:var(--muted)} .sec-meta b{color:var(--heading);font-weight:700}   /* tab already names the list → no repeated title */
.vbtn{position:relative;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;transition:background .16s,transform .12s var(--ease-out)}
.vbtn:hover{background:rgba(255,196,46,.1)}
.vbtn:active{transform:scale(.92)}
.vbtn svg{grid-area:1/1;transition:opacity .18s var(--ease-out),transform .22s var(--ease-out)}
.vbtn .i-list{opacity:0;transform:rotate(-90deg) scale(.6)}
.vbtn.is-grid .i-grid{opacity:0;transform:rotate(90deg) scale(.6)}
.vbtn.is-grid .i-list{opacity:1;transform:none}

.panel.view-in{animation:viewIn .26s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px) scale(.992)}to{opacity:1;transform:none}}

/* ---------- Sections (My shows) — same headers as the app ---------- */
.sec{margin-bottom:40px}
.sec-h{display:flex;align-items:center;gap:12px;min-height:40px;margin-bottom:14px}
.sec-h .t{display:flex;flex-direction:column}
.sec-h h2{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.2px;color:var(--heading)}
.sec-h .count{font-family:var(--font);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h .hint{font-size:12.4px;color:var(--muted);margin-top:2px}
.sec-h .sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(var(--glass),.1);background:rgba(var(--glass),.06);font-size:13px;font-weight:600;color:var(--heading);cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(var(--glass),.1)}
.link{border:0;background:none;color:var(--accent-fg);font-weight:700;font-size:13.6px;cursor:pointer;padding:8px 6px;border-radius:8px;white-space:nowrap}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.chev{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease-out)}
.chev:hover{background:rgba(var(--glass),.06)}
.sec.collapsed .chev{transform:rotate(180deg)}
.sec.collapsed .sec-b{display:none}
.more-note{margin:12px 0 0;font-size:12.4px;color:var(--muted)}

/* layouts */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.rows{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.posters{display:grid;align-items:start;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.clip > .item.over{display:none}

/* ---------- Watching now card (desktop version of the app's hero) ---------- */
.hero{position:relative;height:210px;border-radius:var(--r-card);overflow:hidden;isolation:isolate;background:var(--ph) center/cover no-repeat;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,0) 28%,rgba(0,0,0,.88))}
.hero .info{position:absolute;left:18px;right:78px;bottom:18px;z-index:1}
.hero .title{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep{display:flex;align-items:baseline;gap:8px;margin-top:3px;min-width:0}
.code{white-space:nowrap}
.eptitle{min-width:0;flex:1}
.code{color:var(--accent-fg);font-weight:700;font-variant-numeric:tabular-nums}
.hero .code{font-size:15px}
.eptitle{color:var(--dim);font-size:12.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .bar{position:absolute;left:18px;right:18px;bottom:10px;height:5px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.18);z-index:1}
.hero .info{bottom:26px!important}
.hero .mark{bottom:24px!important}
.hero .bar i,.pbar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .6s var(--ease-out)}

/* ✓ (same as the app: circle + check, 44px) */
.mark{position:absolute;z-index:2;width:44px;height:44px;border-radius:50%;padding:0;line-height:0;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s var(--ease-out),background .16s}
.mark:hover{background:rgba(255,196,46,.22);border-color:rgba(255,196,46,.6)}
.mark:active{transform:scale(.88)}
.mark svg{width:16px;height:12px}
.hero .mark{right:16px;bottom:18px}

/* ---------- Row card (Been a while / Returning / Completed) — floating rounded image, no hard edge ---------- */
.row{position:relative;height:96px;border-radius:var(--r-row);overflow:hidden;isolation:isolate;background:var(--surface);display:flex;align-items:center}
.row .bd{position:absolute;inset:-21.6px -14.4px;z-index:-2;background:center/cover no-repeat;filter:blur(5px);opacity:.28}
.row .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(var(--scrim),.1),rgba(var(--scrim),.275) 35%,rgba(var(--scrim),.45))}
.row .thumb{flex:none;width:150px;height:84px;margin-left:6px;border-radius:10px;background:var(--ph) center/cover no-repeat;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.row .info{flex:1;min-width:0;padding:0 64px 0 16px}
.row .title{font-size:14.6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .code{font-size:13px}
.row .sub{margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub b{color:var(--accent-fg);font-weight:700}
.row .pbar{margin-top:8px;height:5px;border-radius:3px;border-radius:2px;background:rgba(var(--glass),.1);overflow:hidden;max-width:220px}
.row .mark{right:14px;top:50%;margin-top:-19.8px;width:40px;height:40px}
.row .mark::after{content:"";position:absolute;inset:-1.8px;border-radius:50%}

/* ---------- Poster tile (Grid view) — same as the app grid ---------- */
.tile{position:relative;min-width:0}
.pst{position:relative;aspect-ratio:2/3;border-radius:var(--r-poster);overflow:hidden;isolation:isolate;background:var(--ph) center/cover no-repeat;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.pst::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,0) 58%,rgba(0,0,0,.7));pointer-events:none}
.pst .badge{position:absolute;left:9px;bottom:9px;z-index:1;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.pst .tag{position:absolute;left:8px;top:8px;z-index:1;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--amber);font-size:9.6px;font-weight:800;letter-spacing:.1em}
.pst .cd{position:absolute;right:8px;bottom:8px;z-index:1;padding:5px 8px;border-radius:9px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11.4px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.pst .cd.today{background:var(--amber);color:var(--ink)}
.pst .mark{right:8px;bottom:8px;width:36px;height:36px}
.pst .mark::after{content:"";position:absolute;inset:-3.6px;border-radius:50%}
.pst .mark svg{width:14px;height:11px}
.tile .pbar{height:5px;border-radius:3px;border-radius:2px;background:rgba(var(--glass),.1);overflow:hidden;margin-top:9px}
.tile .tname{margin-top:7px;font-size:13.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tsub{margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tsub b{color:var(--accent-fg);font-weight:700}

/* ---------- Upcoming card (same as the app: floating 2:3 poster on a blurred poster) ---------- */
.ugroup{margin-bottom:36px}
.ucards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.ucard{position:relative;display:flex;align-items:center;height:136px;border-radius:var(--r-row);overflow:hidden;isolation:isolate;background:var(--surface)}
.ucard .bd{position:absolute;inset:-7.2px -14.4px;z-index:-2;background:center/cover no-repeat;filter:blur(5px);opacity:.28}
.ucard .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(var(--scrim),.8),rgba(var(--scrim),.64) 23%,rgba(var(--scrim),.8))}
.ucard .poster{flex:none;width:80px;height:120px;margin-left:8px;border-radius:10px;background:var(--ph) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.ucard .uinfo{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;padding:13px 14px 13px 16px}
.ucard .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.ucard .ubadge{color:var(--accent-fg);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:12px}
.ucard .utitle{margin-top:auto;font-size:16px;font-weight:700;line-height:1.25;padding-right:84px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ucard .code{font-size:14px}
.ucard .usub{color:var(--muted);font-size:12.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:84px;margin-top:2px}
.ucard .count-d{position:absolute;right:16px;bottom:13px;text-align:right;line-height:1}
.ucard .count-d b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ucard .count-d small{font-size:11.4px;color:var(--muted)}
.ucard .count-d.today b{font-size:24px;color:var(--accent-fg)}
.gh{display:flex;align-items:baseline;gap:8px;margin:0 0 14px}
.gh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.gh .count{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- Mark watched: the app's amber sweep ---------- */
.sweep{position:absolute;inset:0;z-index:3;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;transform:translateX(-101%);pointer-events:none;border-radius:inherit}
.sweep .bdg{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--amber);display:grid;place-items:center;transform:scale(0)}
.sweep .bdg svg{width:17px;height:17px}
.sweep b{font-size:15px;font-weight:800;letter-spacing:.08em;opacity:0}
.pst .sweep{flex-direction:column;gap:8px}
.pst .sweep b{font-size:12px}
.s-in .sweep{transform:none;transition:transform .42s var(--ease-io)}
.s-in .sweep .bdg{transform:scale(1);transition:transform .42s var(--spring) .18s}
.s-in .sweep b{opacity:1;transition:opacity .24s .24s}
.s-out .sweep{transform:translateX(101%);transition:transform .46s var(--ease-io)}
.s-out .sweep .bdg{transform:scale(1)} .s-out .sweep b{opacity:1}
/* final episode: "SERIES COMPLETE" / "ALL CAUGHT UP" + the count, same as the app */
.sweep .wcol{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.pst .sweep .wcol{align-items:center;text-align:center;padding:0 8px}
.sweep small{font-size:12px;font-weight:600;opacity:0;transform:translateY(4px)}
.sweep small:empty{display:none}
.pst .sweep small{font-size:10.6px}
.done .sweep b{letter-spacing:.06em}
.pst.done .sweep b{font-size:11.4px;line-height:1.15}
.s-in .sweep small{opacity:.72;transform:none;transition:opacity .26s .36s,transform .36s var(--ease-out) .36s}
.item.gone{opacity:0;transform:scale(.96);transition:opacity .22s,transform .26s var(--ease-out);pointer-events:none}
.fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:60;pointer-events:none}
.item.flip{transition:transform .5s var(--ease-out)}

/* ---------- Misc ---------- */
.noresult{color:var(--muted);text-align:center;padding:40px 0}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--toast);border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:13.6px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .25s var(--ease-out);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ .gsearch{width:240px} .mainnav a,.ddbtn{padding:0 9px} }
@media (max-width:1100px){ :root{--gut:24px} .gsearch{width:200px} }
@media (max-width:900px){
  .mainnav,.gsearch kbd{display:none}
  .gsearch{width:auto;flex:1}
  .tab{font-size:22px} .tabs{gap:28px}
  .ucards{grid-template-columns:minmax(0,1fr)}
  .menubtn{display:grid}
}

.pill.p{color:var(--purple-fg)}

/* grid: detail line takes the colour of its bar */

/* =========================================================
   LIGHT THEME — same rule as the app: amber stays a FILL (tab underline,
   bars, buttons, badges, sweep); amber TEXT/ICONS become near-black.
   ========================================================= */
:root[data-theme="light"]{
  --bg:#f5f5f7; --bg-rgb:245,245,247; --surface:#fff; --surface-2:#ececf0; --line:rgba(16,18,27,.09);
  --text:#15161c; --heading:#0e0f14; --muted:#5e6476; --muted-2:#6b7183; --dim:#3f4557;
  --accent-fg:#15161c; --glass:16,18,27; --scrim:255,255,255; --ph:#e2e3e9; --menu:#fff; --toast:#1f2029;
  --toggle-off:#e2e3e8; --green-fg:#10813D; --purple-fg:#6D48E0; --red:#E5242B;
}
:root[data-theme="light"] html,html[data-theme="light"]{color-scheme:light}
.brand .logo-l{display:none}
:root[data-theme="light"] .brand .logo-d{display:none} :root[data-theme="light"] .brand .logo-l{display:block}

:root[data-theme="light"] .toast{color:#f4f5f8;border-color:transparent;box-shadow:0 11.1px 33.3px rgba(20,22,30,.25)}

.tt-prim:has(+ .tt-sec){grid-column:span 2} .tt-prim + .tt-sec{grid-column:span 2}
.tt-ic{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--text);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.tt-ic svg{box-sizing:content-box;width:20px;height:20px;padding:14px;border-radius:50%;background:rgba(var(--glass),.08);box-shadow:inset 0 0 0 1px rgba(var(--glass),.06)}
.tt-ic:active svg{transform:scale(.92)}
.tt-ic span{color:var(--muted)}
:root[data-theme="light"] .tt-ic svg,:root[data-theme="light"] .tt-sec,:root[data-theme="light"] .tt-prim.done{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.06)}
/* progress */
.tt-prog{display:flex;flex-direction:column;gap:9px;padding:14px 16px;border-radius:16px;background:rgba(var(--glass),.05)}
.tt-pt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)} .tt-pt b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.tt-bar{display:block;height:5px;border-radius:3px;background:rgba(var(--glass),.12);overflow:hidden} .tt-bar i{display:block;width:var(--p);height:100%;border-radius:3px;background:#ffc42e;transition:width .5s var(--ease-out,ease)}
.tt-now{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(var(--glass),.05)}
.tt-nowi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#1c1400;background:#ffc42e}
.tt-now > span:last-child{display:flex;flex-direction:column;gap:2px} .tt-now b{font-size:14.5px} .tt-now small{font-size:12.5px;color:var(--muted)}
:root[data-theme="light"] .tt-prog,:root[data-theme="light"] .tt-now{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.05),0 0 0 1px rgba(16,18,27,.05)}

/* sticky tabs — the Shows tabs */
.tt-tabs{position:sticky;top:calc(var(--safe-top,44px) + 52px);z-index:5;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-top:26px;padding:0 20px;background:rgba(var(--bg-rgb),.72);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.tt-tabs::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line)}
.tt-tabs button{height:44px;border:0;background:none;padding:0;font:inherit;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .2s}
.tt-tabs button[aria-selected="true"]{color:var(--accent-fg);font-weight:700}
.tt-ind{position:absolute;left:20px;bottom:0;z-index:1;width:calc((100% - 40px) / var(--n));height:2px;border-radius:2px;background:var(--amber,#ffc42e);transform:translateX(calc(100% * var(--i,0)));transition:transform .3s var(--ease-out,ease)}

/* sections */
.tt-body{display:flex;flex-direction:column;padding:0 20px 120px}
.tt-sec-b{display:flex;flex-direction:column;gap:14px;padding-top:28px}
.tt-sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.tt-sh h2{margin:0;font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--heading,var(--text))}
.tt-cnt{font-size:13px;font-weight:700;color:var(--muted)}
.tt-chv{color:var(--accent-fg);display:grid;place-items:center;width:28px;height:28px;margin-right:-6px}
.tt-ov{margin:0;font-size:15px;line-height:1.55;color:var(--text);opacity:.92}
.tt-facts,.tt-det,.tt-crew{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.tt-facts dt,.tt-det dt,.tt-crew dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tt-facts dd,.tt-det dd,.tt-crew dd{margin:4px 0 0;font-size:14px;font-weight:600;line-height:1.35}
.tt-facts{grid-template-columns:repeat(3,minmax(0,1fr))}
.tt-det{padding:16px;border-radius:16px;background:rgba(var(--glass),.05)}
:root[data-theme="light"] .tt-det{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.05),0 0 0 1px rgba(16,18,27,.05)}
/* up next — the Shows "watching" card */
.tt-next{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:16px;overflow:hidden;isolation:isolate;background:#15161c;color:#fff;text-align:left;cursor:pointer;font:inherit}
.tt-nst{position:absolute;inset:0;z-index:-2;background:center/cover no-repeat}
.tt-nsh{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.88))}
.tt-nb{position:absolute;left:16px;right:16px;bottom:15px;display:flex;flex-direction:column;gap:3px}
.tt-nb small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ffc42e}
.tt-nb b{font-size:17px;font-weight:800;line-height:1.2}
.tt-nc{font-size:12.5px;color:#c9cedc} .tt-nc em{font-style:normal;font-weight:800;color:#ffc42e}
.tt-next:active{transform:scale(.985)}
.tt-latest{display:flex;align-items:center;gap:12px}
.tt-lst{flex:none;width:96px;aspect-ratio:16/9;border-radius:10px;background:var(--ph) center/cover}
.tt-latest > span:last-child{min-width:0;display:flex;flex-direction:column;gap:2px}
.tt-latest small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tt-latest small i{font-style:normal;height:17px;padding:0 6px;border-radius:5px;display:inline-flex;align-items:center;font-size:9.5px;color:#1c1400;background:#ffc42e}
.tt-latest b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tt-latest em{font-style:normal;font-size:12px;color:var(--muted)}
/* where to watch */
.tt-where{display:flex;flex-direction:column;gap:10px}
.tt-prov{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 10px;border:0;border-radius:16px;background:rgba(var(--glass),.05);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.tt-prov img,.tt-provi{flex:none;width:44px;height:44px;border-radius:11px;object-fit:cover}
.tt-provi{display:grid;place-items:center;color:#1c1400;background:#ffc42e}
.tt-prov > span:not(.tt-provi){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px} .tt-prov b{font-size:14.5px} .tt-prov small{font-size:12.5px;color:var(--muted)}
.tt-prov > svg{color:var(--accent-fg)}
:root[data-theme="light"] .tt-prov{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.05),0 0 0 1px rgba(16,18,27,.05)}
/* episodes */
.tt-rev{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:16px;background:rgba(var(--glass),.08);color:var(--text);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tt-rev[aria-pressed="true"] svg{color:var(--accent-fg)}
.tt-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.tt-chips::-webkit-scrollbar{display:none}
.tt-chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:19px;background:rgba(var(--glass),.08);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.tt-chip span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tt-chip.on{background:#f4f5f8;color:#15161c} .tt-chip.on span{color:#5b6070}
.tt-ck{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#ffc42e;color:#1c1400} .tt-ck svg{width:10px;height:8px}
:root[data-theme="light"] .tt-chip{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.08)} :root[data-theme="light"] .tt-chip.on{background:#15161c;color:#fff;box-shadow:none} :root[data-theme="light"] .tt-chip.on span{color:#c9cedc}
.tt-season{position:relative;display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;overflow:hidden;isolation:isolate;background:rgba(var(--glass),.05)}
.tt-sp{flex:none;width:56px;height:84px;border-radius:9px;background:var(--ph) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tt-sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tt-sb small{font-size:12px;font-weight:700;color:var(--muted)} .tt-sb b{font-family:var(--display);font-size:18px;font-weight:800;line-height:1.15} .tt-sb em{font-style:normal;font-size:13px;color:var(--accent-fg);font-weight:700}
.tt-sr{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center}
.tt-ring{position:absolute;inset:0;width:48px;height:48px}
.tt-sr b{position:relative;font:800 12.5px/1 var(--font);font-variant-numeric:tabular-nums} .tt-sr b small{font-size:8.5px;opacity:.75}
:root[data-theme="light"] .tt-season{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.05),0 0 0 1px rgba(16,18,27,.05)}
.tt-all{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:18px;background:none;box-shadow:inset 0 0 0 1.5px rgba(var(--glass),.18);color:var(--text);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.tt-all svg{color:var(--accent-fg)}
:root[data-theme="light"] .tt-all{box-shadow:inset 0 0 0 1.5px rgba(16,18,27,.18)}
.tt-eps{display:flex;flex-direction:column;gap:4px}
.tt-ep{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tt-ep:last-child{border-bottom:0}
.tt-es{position:relative;flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--ph) center/cover no-repeat}
.tt-es.blur::after{content:"";position:absolute;inset:-8px;background:inherit;filter:blur(10px);transform:scale(1.1)}
.tt-es i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tt-ep.w .tt-es{opacity:.72}
.tt-et{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:1px}
.tt-et small{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tt-et small i{font-style:normal;height:17px;padding:0 6px;border-radius:5px;display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tt-et small i.nx{color:#1c1400;background:#ffc42e} .tt-et small i.fin{color:var(--text);background:rgba(var(--glass),.12)}
.tt-et b{font-size:14.5px;font-weight:700;line-height:1.25}
.tt-eo{font-size:12.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt-ep.soon b{color:var(--muted)}
.tt-eck{flex:none;align-self:center;width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--muted);background:none;box-shadow:inset 0 0 0 1.5px rgba(var(--glass),.22);transition:background .2s,color .2s,transform .15s}
.tt-eck.on{color:#1c1400;background:#ffc42e;box-shadow:none}
.tt-eck:active{transform:scale(.88)}
.tt-ep.nx .tt-eck{color:var(--accent-fg);box-shadow:inset 0 0 0 1.5px #ffc42e}
:root[data-theme="light"] .tt-eck{box-shadow:inset 0 0 0 1.5px rgba(16,18,27,.22)} :root[data-theme="light"] .tt-eck.on{color:#1c1400;box-shadow:none}
/* cast */
.tt-cast{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.tt-cast::-webkit-scrollbar{display:none}
.tt-pp{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;color:var(--text);font:inherit;text-align:center;cursor:pointer}
.tt-pp span{width:78px;height:78px;border-radius:50%;margin-bottom:5px;background:var(--ph) center 20%/cover;box-shadow:0 0 0 1px rgba(var(--glass),.08)}
.tt-pp b{font-size:12.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt-pp small{font-size:11.5px;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt-pp em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent-fg)}
.tt-crew{margin-top:6px}
/* videos + photos */
.tt-vids,.tt-gal,.tt-sim{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.tt-vids::-webkit-scrollbar,.tt-gal::-webkit-scrollbar,.tt-sim::-webkit-scrollbar{display:none}
.tt-vd{flex:none;width:236px;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.tt-vd span{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;margin-bottom:6px;background:var(--ph) center/cover}
.tt-vd span i{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tt-vd small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tt-vd b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-ph{flex:none;width:236px;aspect-ratio:16/9;border:0;padding:0;border-radius:14px;background:var(--ph) center/cover;cursor:pointer}
/* more like this — the standard poster */
.tt-pt2{flex:none;width:104px;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;color:var(--text);font:inherit;cursor:pointer}
.tt-pt2 span{display:block;width:100%;aspect-ratio:2/3;border-radius:12px;background:var(--ph) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tt-pt2 small{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700} .tt-pt2 small svg{color:#ffc42e}
:root[data-theme="light"] .tt-pt2 span{box-shadow:0 4px 12px rgba(20,22,30,.16)}
.tt-kw{display:flex;flex-wrap:wrap;gap:8px}
.tt-kw button{height:32px;padding:0 12px;border:0;border-radius:16px;background:rgba(var(--glass),.07);color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
:root[data-theme="light"] .tt-kw button{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.08)}
.tt-talk{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:16px;border:0;border-radius:18px;background:linear-gradient(120deg,rgba(255,196,46,.16),rgba(255,138,61,.1));color:var(--text);font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,196,46,.22)}
.tt-talki{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#1c1400;background:#ffc42e}
.tt-talk > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:3px} .tt-talk b{font-size:15px} .tt-talk small{font-size:12.5px;line-height:1.4;color:var(--muted)}
.tt-talk > svg{color:var(--accent-fg)}
button:focus-visible{outline:2px solid var(--amber,#ffc42e);outline-offset:2px}

/* ===================== web ===================== */
.tt-web{--hh:min(78vh,700px)}
.tt-web .tt-hero{min-height:var(--hh);display:flex;align-items:flex-end}
.tt-web .tt-media,.tt-web .tt-shade{left:50%;right:auto;width:100vw;margin-left:-50vw;top:-64px;height:calc(var(--hh) + 64px)}
.tt-web .tt-shade{background:linear-gradient(90deg,rgba(var(--bg-rgb),.92) 0%,rgba(var(--bg-rgb),.62) 30%,rgba(var(--bg-rgb),0) 62%),linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(var(--bg-rgb),0) 62%,var(--tbg) 100%)}
.tt-web .tt-hc{padding:0 0 34px;max-width:620px;gap:12px}
.tt-web .tt-logo{max-width:420px;max-height:150px}
.tt-web .tt-tag{font-size:20px}
.tt-web .tt-meta{font-size:15px} .tt-web .tt-rates{font-size:14.5px}
.tt-web .tt-ov{font-size:16.5px;max-width:560px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tt-web .tt-acts{display:flex;align-items:center;gap:12px;margin-top:8px;width:auto}
.tt-web .tt-prim,.tt-web .tt-sec{height:52px;padding:0 26px;grid-column:auto}
.tt-web .tt-ic{flex-direction:row;height:52px;padding:0 18px 0 16px;border-radius:26px;gap:8px;background:rgba(var(--glass),.1);font-size:14px;font-weight:700;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tt-web .tt-ic svg{padding:0;background:none;box-shadow:none;width:18px;height:18px}
.tt-web .tt-ic span{color:var(--text)}
.tt-web .tt-ic:hover,.tt-web .tt-sec:hover{background:rgba(var(--glass),.16)}
.tt-web .tt-prim:hover{filter:brightness(1.05)}
.tt-web .tt-mute{position:absolute;right:0;bottom:40px;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
:root[data-theme="light"] .tt-web .tt-shade{background:linear-gradient(90deg,rgba(var(--bg-rgb),.94) 0%,rgba(var(--bg-rgb),.66) 32%,rgba(var(--bg-rgb),0) 62%),linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 22%,rgba(var(--bg-rgb),0) 62%,var(--tbg) 100%)}
:root[data-theme="light"] .tt-web .tt-ic{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.06)}
.tt-web .tt-pw{max-width:620px}
.tt-web .tt-tabs{top:64px;margin:30px calc(var(--gut,40px) * -1) 0;padding:0 var(--gut,40px);grid-template-columns:repeat(var(--n),max-content);gap:34px}
.tt-web .tt-tabs::after{left:0;right:0}
.tt-web .tt-tabs button{height:54px;font-size:16px}
.tt-web .tt-ind{display:none}
.tt-web .tt-tabs button{position:relative} .tt-web .tt-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--amber,#ffc42e)}
.tt-web .tt-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0 56px;align-items:start;padding:0 0 100px}
.tt-web .tt-main{min-width:0;display:flex;flex-direction:column}
.tt-web .tt-side{position:sticky;top:132px;display:flex;flex-direction:column;gap:14px;padding-top:28px}
.tt-web .tt-side .tt-sec-b{padding-top:0}
.tt-web .tt-side .tt-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.tt-web .tt-eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px}
.tt-web .tt-ep:nth-last-child(2):nth-child(odd){border-bottom:0}
.tt-web .tt-es{width:150px}
.tt-web .tt-chips,.tt-web .tt-cast,.tt-web .tt-vids,.tt-web .tt-gal,.tt-web .tt-sim{margin:0;padding:2px 0 4px}
.tt-web .tt-cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 12px;overflow:visible}
.tt-web .tt-pp{width:auto} .tt-web .tt-pp span{width:92px;height:92px}
.tt-web .tt-vids,.tt-web .tt-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
.tt-web .tt-vd,.tt-web .tt-ph{width:auto}
.tt-web .tt-sim{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;overflow:visible}
.tt-web .tt-pt2{width:auto}
.tt-web .tt-sim .tt-pt2:nth-child(n+7){display:none}

    bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 12 0c0 4.6 1.6 6.6 2.5 7.5h-17c.9-.9 2.5-2.9 2.5-7.5z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg>',
    bellOn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 12 0c0 4.6 1.6 6.6 2.5 7.5h-17c.9-.9 2.5-2.9 2.5-7.5z"/><path d="M10 19.5a2 2 0 0 0 4 0" fill="none" stroke-linecap="round"/></svg>',
    star: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.3L12 17.1l-5.6 3l1.1-6.3L2.9 9.4l6.3-.9z"/></svg>',
    chat: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4A8 8 0 1 1 20 12z"/></svg>',
    chatL: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4A8 8 0 1 1 20 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg>',
    user: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2.5 20c.8-4 4-6 7.5-6s6.7 2 7.5 6z"/><path d="M19 7v6M16 10h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    tv: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3l5 4 5-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="7" width="20" height="14" rx="3"/></svg>',
    send: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>',
    eye: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.9 3.8M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    more: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
    search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    checks: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5l4 4 8-9"/><path d="M11.5 16l.5.5 8-9"/></svg>',
    go: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.8 3L10.8 8L5.8 13" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    imdb: '<svg width="34" height="17" viewBox="0 0 34 17" aria-hidden="true"><rect width="34" height="17" rx="3.5" fill="#F5C518"/><text x="17" y="12.6" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="10" fill="#000">IMDb</text></svg>',
    ig: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
    x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg>'
  };
  /* avatars: the real photo when we have one, otherwise initials on a colour picked from the handle (stable per person) */
  const HUES = [["#ffcf5a", "#ff8a3d"], ["#7ee0b0", "#2bb673"], ["#8fb8ff", "#4a6cf7"], ["#d4a3ff", "#8a4cf0"], ["#ff9fb2", "#f0466e"], ["#7fe3f0", "#1ea5c9"], ["#ffd08a", "#e0892b"], ["#b8c4d8", "#6c7a93"]];
  const hue = u => { let h = 0; for (const c of String(u)) h = (h * 31 + c.codePointAt(0)) >>> 0; return HUES[h % HUES.length]; };
  const initials = (n, u) => { const w = String(n).replace(/[^\p{Script=Latin}\p{Script=Arabic}\p{N}\s]/gu, "").trim().split(/\s+/).filter(Boolean); return (w.length ? (w[0][0] + (w[1] ? w[1][0] : "")) : String(u || "?")[0]).toUpperCase(); };
  const av = (a, cls = "") => a.av ? `<span class="so-av ${cls}" style="background-image:url('${esc(a.av)}')" aria-hidden="true"></span>`
    : (([c1, c2]) => `<span class="so-av ${cls}" style="background:linear-gradient(140deg,${c1},${c2})" aria-hidden="true"><i>${esc(initials(a.n, a.u))}</i></span>`)(hue(a.u));
  const ring = (pct, r = 15) => { const c = 2 * Math.PI * r; return `<svg class="so-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(128,128,140,.28)" stroke-width="3.2"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="#ffc42e" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/></svg>`; };
  const WTAG = '<i class="tvt-wtag">Watched</i>';
  const LTAG = '<i class="so-ltag">On watchlist</i>';

  function mount(root, page, arg, opt = {}) {
    const web = opt.mode === "web", toast = opt.toast || (() => { });
    const stack = [];
    let cur = null;           // { page, arg, st }
    const S = {               // state shared across pages for this session (prototype)
      fol: new Set(D.following.map(x => x[1])), favs: {}, alerts: {}, read: false,
      likes: {}, threads: JSON.parse(JSON.stringify(D.threads)), epDone: {}, wl: {}
    };
    const followers = new Set(D.followers.map(x => x[1]));

    /* ---------- page shells ---------- */
    const head = (title, small, right) => web
      ? `<header class="so-wh"><button type="button" class="so-wback" data-back aria-label="Back">${I.back}</button><div class="so-wt"><h1>${title}</h1>${small ? `<small>${small}</small>` : ""}</div>${right || ""}</header>`
      : `<header class="so-head"><button type="button" class="so-back" data-back aria-label="Back">${I.back}</button><h1>${title}${small ? `<small>${small}</small>` : ""}</h1><span class="so-hr">${right || ""}</span></header>`;
    const tabs = (list, i, key) => `<div class="so-tabs" role="tablist" style="--n:${list.length};--i:${i}">${list.map((o, j) => `<button type="button" role="tab" data-${key}="${o.k}" aria-selected="${i === j}">${o.l}${o.n != null ? `<small>${o.n}</small>` : ""}</button>`).join("")}<i class="so-ind" aria-hidden="true"></i></div>`;
    const chips = (list, curK, key) => `<div class="so-chips" role="tablist">${list.map(o => `<button type="button" role="tab" data-${key}="${o.k}" aria-selected="${o.k === curK}">${o.l}${o.n != null ? ` <span>${o.n}</span>` : ""}</button>`).join("")}</div>`;

    /* ======================= PERSON (actor) ======================= */
    function person(st) {
      const p = (D.people || {})[st.arg] || D.person, M = p.movies, w = M.filter(m => m[6] === 1), wl = M.filter(m => m[6] === 2), rated = w.filter(m => m[7]);
      const avg = rated.length ? (rated.reduce((a, m) => a + m[7], 0) / rated.length) : 0, pct = Math.round(w.length / M.length * 100);
      const by = +p.born.slice(0, 4), age = 2026 - by - (new Date(D.now) < new Date("2026" + p.born.slice(4)) ? 1 : 0);
      const pl = p.place.split(/,\s*/), place = pl.length > 1 ? pl[0] + ", " + pl[pl.length - 1].replace(/^England$/, "UK") : p.place;
      const known = p.known.map(id => M.find(m => m[5] === id)).filter(Boolean);
      const tag = m => m[6] === 1 ? WTAG : m[6] === 2 ? LTAG : m[6] === 3 ? '<i class="so-ltag">Watching</i>' : "";
      const tile = m => `<button type="button" class="so-pt" data-title="${esc(m[0])}" aria-label="${esc(m[0])}"><span class="so-pp" style="background-image:url('${T(m[1], "w342")}')">${tag(m)}</span><b>${esc(m[0])}</b><small>${esc(m[3])}</small></button>`;
      const row = (m, show) => `<button type="button" class="so-fr" data-title="${esc(m[0])}"><span class="so-fy">${m[2]}</span><span class="so-fp" style="background-image:url('${T(m[1], "w185")}')"></span><span class="so-ft"><b>${esc(m[0])}</b><small>${esc(m[3] || (show ? "Self" : ""))}</small><span class="so-fm">${m[4] ? `<em class="so-sc">${I.star}${m[4].toFixed(1)}</em>` : ""}${!show && m[7] ? `<em class="so-mine">You ${m[7]}/10</em>` : ""}${tag(m)}</span></span></button>`;
      const sortM = st.sort === "pop" ? M.slice().sort((a, b) => b[4] - a[4]) : st.sort === "seen" ? M.filter(m => m[6]).sort((a, b) => a[6] - b[6] || b[2] - a[2]) : M.slice().sort((a, b) => b[2] - a[2]);
      const facts = [["Known for", "Acting"], ["Born", `${longDate(p.born)} · ${age} years old`], ["Birthplace", p.place], ["Also known as", p.aka.join(", ")]].filter(f => f[1]);
      const socials = `<div class="so-links"><button type="button" class="so-lk" data-soon="IMDb">${I.imdb}</button>${p.ig ? `<button type="button" class="so-lk" data-soon="Instagram" aria-label="Instagram @${esc(p.ig)}">${I.ig}</button>` : ""}${p.x ? `<button type="button" class="so-lk" data-soon="X" aria-label="X @${esc(p.x)}">${I.x}</button>` : ""}</div>`;
      const you = `<section class="so-you" aria-label="You and ${esc(p.name)}">
          <span class="so-yr">${ring(pct, 15)}<b>${pct}<small>%</small></b></span>
          <span class="so-yt"><small>Your history</small><b>You've watched ${w.length} of ${M.length} films</b>
            <span class="so-ys">${avg ? `<em>${I.star}${avg.toFixed(1)} your average</em>` : ""}${wl.length ? `<em>${wl.length} on your watchlist</em>` : ""}${!avg && !wl.length ? `<em>${w.length ? "Nice start" : "Start with their best-known film below"}</em>` : ""}</span></span></section>`;
      /* two quiet pills — favourite this person, get told about their next title. Share lives in the top bar (app) / next to them (web). */
      const fav = !!S.favs[p.name], al = !!S.alerts[p.name];
      const acts = `<div class="so-pills">
          <button type="button" class="so-pill${fav ? " on" : ""}" data-pfav aria-pressed="${fav}">${fav ? I.heartOn : I.heart}<span>${fav ? "Favorited" : "Favorite"}</span></button>
          <button type="button" class="so-pill${al ? " on al" : ""}" data-palert aria-pressed="${al}">${al ? I.bellOn : I.bell}<span>${al ? "Notifying you" : "Notify me"}</span></button>
          ${web ? `<button type="button" class="so-pill so-pic" data-soon="Share sheet" aria-label="Share">${I.share}</button>` : ""}</div>`;
      const bio = `<section class="so-sec"><div class="so-sh"><h2>Biography</h2></div>
          <div class="so-bio${st.bio ? " open" : ""}">${p.bio.map(t => `<p>${esc(t)}</p>`).join("")}</div>
          <button type="button" class="so-more" data-bio>${st.bio ? "Show less" : "Read more"}</button><small class="so-src">From ${esc(p.bioSrc)}</small></section>`;
      const details = `<section class="so-sec"><div class="so-sh"><h2>Personal details</h2></div><dl class="so-facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>`;
      const knownS = `<section class="so-sec"><div class="so-sh"><h2>Known for</h2></div><div class="so-row">${known.map(tile).join("")}</div></section>`;
      const photos = n => `<div class="so-gal${n ? " pv" : ""}">${(n ? p.imgs.slice(0, n) : p.imgs).map((g, i) => `<button type="button" class="so-ph" data-soon="Photo viewer" aria-label="Photo ${i + 1}" style="background-image:url('${T(g, "w342")}')"></button>`).join("")}</div>`;
      const movies = `<section class="so-sec"><div class="so-sh"><h2>Movies</h2><span class="so-cnt">${M.length}</span></div>
          ${chips([{ k: "new", l: "Newest" }, { k: "pop", l: "Top rated" }, { k: "seen", l: "Yours", n: w.length + wl.length }], st.sort, "psort")}
          <div class="so-flist">${sortM.map(m => row(m)).join("")}</div></section>`;
      const shows = `<section class="so-sec"><div class="so-sh"><h2>Shows</h2><span class="so-cnt">${p.shows.length}</span></div><p class="so-note">Talk shows, award nights and guest appearances.</p>
          <div class="so-flist">${p.shows.map(m => row(m, true)).join("")}</div></section>`;
      const photoS = `<section class="so-sec"><div class="so-sh"><h2>Photos</h2><span class="so-cnt">${p.imgs.length}</span></div>${photos()}</section>`;
      const TABS = [{ k: "ov", l: "Overview" }, { k: "mv", l: "Movies" }, { k: "sh", l: "Shows" }, { k: "ph", l: "Photos" }];
      const pane = st.pane || "ov";
      const hero = `<div class="so-hero">
          <div class="so-hbd" style="background-image:url('${T(p.bd, "w1280")}')"></div><div class="so-hsh"></div>
          <div class="so-hc"><span class="so-por" style="background-image:url('${T(p.photo, "h632")}')"></span>
            <div class="so-hi"><span class="so-kick">${p.name === "Tom Cruise" ? "Actor · Producer" : "Actor"}</span><h1 class="so-name">${esc(p.name)}</h1>
              <p class="so-hm"><span>Born ${longDate(p.born)}</span><span>Age ${age}</span></p><p class="so-hm so-pl">${esc(place)}</p>${socials}</div></div></div>`;
        /* website: photo, buttons and the key facts stay put on the left; the name rises a little, then holds at the top;
           only the right column scrolls — Biography (in full) · Photos · Movies · TV shows. Posters carry no text and fill the row. */
        const pt = m => `<button type="button" class="pw-pt" data-title="${esc(m[0])}" aria-label="${esc(m[0])}${m[3] ? ", as " + esc(m[3]) : ""}"><span class="so-pp" style="background-image:url('${T(m[1], "w342")}')">${tag(m)}</span></button>`;
        const byNew = L => L.slice().sort((a, b) => b[2] - a[2]);
        const sec = (h, body) => `<section class="so-sec pw-sec"><div class="so-sh"><h2>${h}</h2></div>${body}</section>`;
        const wfacts = [["Born", `${longDate(p.born)} · ${age} years old`], ["Birthplace", p.place], ["Also known as", p.aka.join(", ")]].filter(f => f[1]);
        const gal = p.imgs.filter(g => g !== p.photo);
        /* links: one shape (a 40px curved square), each in its own brand colours */
        const BR = {
          imdb: '<svg width="30" height="15" viewBox="0 0 34 17" aria-hidden="true"><text x="17" y="13.2" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="13" fill="#000">IMDb</text></svg>',
          ig: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="#fff" stroke="none"/></svg>',
          x: I.x.replace('width="16" height="16"', 'width="17" height="17"').replace('fill="currentColor"', 'fill="#fff"'),
          web: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></svg>',
          fb: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z"/></svg>',
          tt: '<svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path fill="#25F4EE" d="M15.2 3.6h-2.9v11.5a2.5 2.5 0 1 1-2.5-2.5c.3 0 .5 0 .7.1V9.8a5.4 5.4 0 1 0 4.7 5.3V9.3a7 7 0 0 0 4 1.3V7.7a4 4 0 0 1-4-4.1z" transform="translate(-.9 -.7)"/><path fill="#FE2C55" d="M15.2 3.6h-2.9v11.5a2.5 2.5 0 1 1-2.5-2.5c.3 0 .5 0 .7.1V9.8a5.4 5.4 0 1 0 4.7 5.3V9.3a7 7 0 0 0 4 1.3V7.7a4 4 0 0 1-4-4.1z" transform="translate(.9 .7)"/><path fill="#fff" d="M15.2 3.6h-2.9v11.5a2.5 2.5 0 1 1-2.5-2.5c.3 0 .5 0 .7.1V9.8a5.4 5.4 0 1 0 4.7 5.3V9.3a7 7 0 0 0 4 1.3V7.7a4 4 0 0 1-4-4.1z"/></svg>',
          yt: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M8.5 5.8v12.4L18.6 12z"/></svg>' };
        const links = `<div class="pw-links">${[["web", "Official site", p.site], ["imdb", "IMDb", true], ["ig", "Instagram", p.ig], ["x", "X", p.x], ["fb", "Facebook", p.fb], ["tt", "TikTok", p.tt], ["yt", "YouTube", p.yt]].filter(l => l[2]).map(([k, n, h]) => `<button type="button" class="pw-lk ${k}" data-soon="${n}" title="${n}" aria-label="${n}${h === true ? "" : ", " + esc(String(h).replace(/^@?/, k === "web" ? "" : "@"))}">${BR[k]}</button>`).join("")}</div>`;
      if (web) {
        return `<div class="so-person pw"><div class="pw-bd" style="background-image:url('${T(p.bd, "w1280")}')"></div><div class="pw-sh"></div>
          <div class="pw-grid">
            <aside class="pw-side"><span class="pw-por" style="background-image:url('${T(p.photo, "h632")}')"></span>
              <div class="pw-acts"><button type="button" class="pw-btn${fav ? " on" : ""}" data-pfav aria-pressed="${fav}">${fav ? I.heartOn : I.heart}<span>${fav ? "Favorited" : "Favorite"}</span></button><button type="button" class="pw-btn pw-ic" data-soon="Share sheet" aria-label="Share">${I.share}</button></div>
              <dl class="pw-facts">${wfacts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></aside>
            <div class="pw-main"><i class="pw-sent" aria-hidden="true"></i>
              <header class="pw-name"><span class="so-kick">${p.name === "Tom Cruise" ? "Actor · Producer" : "Actor"}</span><h1 class="so-name">${esc(p.name)}</h1>${links}</header>
              ${sec("Biography", `<div class="pw-bio">${p.bio.map(t => `<p>${esc(t)}</p>`).join("")}</div><small class="so-src">From ${esc(p.bioSrc)}</small>`)}
              ${gal.length ? sec("Photos", `<div class="so-gal">${gal.map((g, i) => `<button type="button" class="so-ph" data-soon="Photo viewer" aria-label="Photo ${i + 1}" style="background-image:url('${T(g, "w342")}')"></button>`).join("")}</div>`) : ""}
              ${sec("Movies", `<div class="pw-row">${byNew(M).map(pt).join("")}</div>`)}
              ${p.shows.length ? sec("TV shows", `<div class="pw-row">${byNew(p.shows).map(pt).join("")}</div>`) : ""}</div></div></div>`;
      }
      /* app: same order as the website — cover with photo, name and links · Favorite + Share · key facts · Biography · Photos · Movies · TV shows.
         The top bar keeps ‹ and fades to solid with the name once the cover scrolls away. */
      return `<div class="so-person so-pscroll pa"><div class="so-top"><button type="button" class="so-gl" data-back aria-label="Back">${I.back}</button><span class="so-tt pa-tt"><i class="pa-av" style="background-image:url('${T(p.photo, "w185")}')"></i>${esc(p.name)}</span><span></span></div>
          <div class="so-hero"><div class="so-hbd" style="background-image:url('${T(p.bd, "w1280")}')"></div><div class="so-hsh"></div>

            ${gal.length ? sec("Photos", `<div class="pa-gal">${gal.map((g, i) => `<button type="button" class="so-ph" data-soon="Photo viewer" aria-label="Photo ${i + 1}" style="background-image:url('${T(g, "w342")}')"></button>`).join("")}</div>`) : ""}

    /* ======================= NOTIFICATIONS ======================= */
    function notes(st) {
      const F = st.f || "all";
      const kind = n => n[0] === "ep" ? "ep" : n[0] === "like" || n[0] === "reply" ? "cm" : n[0] === "promo" ? "ep" : "so";
      const list = D.notes.filter(n => F === "all" || kind(n) === F);
      const unread = n => !S.read && n[3];
      const grp = [["New", list.filter(unread)], ["This week", list.filter(n => !unread(n) && NOW - new Date(n[1]) < 7 * 864e5)], ["Earlier", list.filter(n => !unread(n) && NOW - new Date(n[1]) >= 7 * 864e5)]].filter(g => g[1].length);
      const fbtn = u => S.fol.has(u) ? `<button type="button" class="so-btn gl" data-follow="${esc(u)}">Following</button>` : `<button type="button" class="so-btn y" data-follow="${esc(u)}">Follow back</button>`;

          return `<article class="so-n${u}"><span class="so-nav"><span class="so-npo" style="background-image:url('${T(x.p, "w185")}')"></span>${badge("e", I.tv)}</span>

    /* ======================= COMMENTS (a title's thread) ======================= */
    function thread(st) {

      const cm = (c, r) => { const mine = c.a.u === me.u, key = "c" + c.id;
        return `<article class="so-c${r ? " rp" : ""}">${av(c.a, r ? "s" : "")}<div class="so-cb">
            <p class="so-ch"><b>${esc(c.a.n)}</b>${mine ? '<i class="so-me">You</i>' : ""}<span>@${esc(c.a.u)} · ${ago(c.d)}</span></p>

            <div class="so-cf">${like(c, key)}<button type="button" class="so-tx" data-reply="${esc(c.a.n)}">Reply</button><button type="button" class="so-tx so-dots" data-soon="Comment options" aria-label="More">${I.more}</button></div>

      const ctx = `<div class="so-ctx">${th.p ? `<span class="so-ctp" style="background-image:url('${T(th.p, "w185")}')"></span>` : `<span class="so-ctp op"></span>`}<span><b>${esc(th.t)}</b><small>${th.k} · ${th.y}</small></span><span class="so-safe">${I.eye}<small>Spoiler-safe</small></span></div>`;

      const body = L.length ? `${chips([{ k: "top", l: "Top" }, { k: "new", l: "Newest" }], st.sort || "top", "csort")}<div class="so-cl">${L.map(c => cm(c)).join("")}</div>`

    }

    /* ======================= YOUR COMMENTS ======================= */
    function mine(st) {
      const L = D.mine;
      const groups = []; L.forEach(c => { const g = groups.find(x => x.t === c[1]); g ? g.c.push(c) : groups.push({ t: c[1], k: c[2], p: c[5], c: [c] }); });
      const att = a => !a ? "" : a[0] === "g" ? `<span class="so-media gif sm"><img src="https://media.giphy.com/media/${a.slice(2)}/200w.gif" alt="GIF" loading="lazy"><i>GIF</i></span>` : `<span class="so-media sm"><img src="https://tvtracker.tv/storage/comments/${a.slice(2)}" alt="" loading="lazy"></span>`;

          <div class="so-stat"><span><b>29</b>Comments</span><span><b>${likes}</b>Likes received</span><span><b>${titles}</b>Titles</span></div>
          ${groups.map(g => `<section class="so-mg"><button type="button" class="so-mh" ${g.c[0][10] ? `data-thread="${g.c[0][10]}"` : `data-soon="${esc(g.t)} comments"`}><span class="so-ctp" style="background-image:url('${T(g.p, "w185")}')"></span><span><b>${esc(g.t)}</b><small>${g.k === "s" ? "Show" : "Movie"} · ${g.c.length} comment${g.c.length > 1 ? "s" : ""}</small></span>${I.go}</button>
            ${g.c.map(c => `<div class="so-mc">${c[3] ? `<i class="so-ep">S${c[3]} · E${c[4]}</i>` : ""}${c[0] ? `<p dir="auto">${esc(c[0]).replace(/@(\w+)/g, '<em>@$1</em>')}</p>` : ""}${att(c[9])}<span class="so-mm">${c[6] ? `<em>${I.heartOn}${c[6]}</em>` : ""}${c[7] ? `<em class="r">${I.chat}${c[7]} repl${c[7] > 1 ? "ies" : "y"}</em>` : ""}<time>${ago(c[8])}</time></span></div>`).join("")}</section>`).join("")}

    }

    /* ======================= FOLLOWERS / FOLLOWING ======================= */
    function follows(st) {
      const t = st.t || "followers", q = (st.q || "").toLowerCase();
      const L = (t === "followers" ? D.followers : D.following).filter(x => !q || (x[0] + " " + x[1]).toLowerCase().includes(q));
      const btn = u => S.fol.has(u) ? `<button type="button" class="so-btn gl" data-follow="${esc(u)}">Following</button>` : `<button type="button" class="so-btn y" data-follow="${esc(u)}">${followers.has(u) ? "Follow back" : "Follow"}</button>`;
      const mutual = D.followers.filter(x => S.fol.has(x[1])).length;
      return `${head(esc(D.me.n), "@" + esc(D.me.u))}
        ${tabs([{ k: "followers", l: "Followers", n: D.followers.length }, { k: "following", l: "Following", n: D.following.length }], t === "followers" ? 0 : 1, "ftab")}
        <div class="so-scroll"><div class="so-in">
          <label class="so-search">${I.search}<input type="search" data-fq placeholder="Search ${t}" aria-label="Search ${t}" value="${esc(st.q || "")}"></label>

          <div class="so-ul">${L.map(x => `<div class="so-u"><button type="button" class="so-ub" data-soon="@${esc(x[1])}'s profile">${av({ n: x[0], u: x[1] })}<span class="so-ut"><b dir="auto">${esc(x[0])}</b><small>@${esc(x[1])}${t === "following" && followers.has(x[1]) ? '<i class="so-fy2">Follows you</i>' : ""}</small></span></button>${btn(x[1])}</div>`).join("") || `<div class="so-empty">${I.search}<b>No one matches “${esc(st.q)}”</b></div>`}</div>
        </div></div>`;
    }

    const PAGES = { person, notes, thread, mine, follows };
    function render(anim) {

      const fq = document.activeElement && document.activeElement.matches("[data-fq], .so-comp input") ? document.activeElement : null, sel = fq ? [fq.selectionStart, fq.matches("[data-fq]") ? "fq" : "comp"] : null;
      root.innerHTML = `<div class="so so-${web ? "web" : "app"} so-p-${cur.page}${anim ? " in-" + anim : ""}">${PAGES[cur.page](cur.st)}</div>`;
      const sc = root.querySelector(".so-scroll, .so-pscroll"); if (sc && y) sc.scrollTop = y; if (web && anim === false) scrollTo({ top: wy });
      if (sel) { const el = root.querySelector(sel[1] === "fq" ? "[data-fq]" : ".so-comp input"); if (el) { el.focus({ preventScroll: true }); el.setSelectionRange(sel[0], sel[0]); } }
      const ps = root.querySelector(".so-pscroll"); if (ps) { const onS = () => root.querySelector(".so").classList.toggle("solid", ps.scrollTop > 190); ps.addEventListener("scroll", onS, { passive: true }); onS(); }
      if (root._pwObs) { root._pwObs.disconnect(); root._pwObs = null; }

      if (sent && nm && "IntersectionObserver" in window) { root._pwObs = new IntersectionObserver(([en]) => nm.classList.toggle("stuck", !en.isIntersecting), { rootMargin: "-70px 0px 0px 0px" }); root._pwObs.observe(sent); }
      opt.onRender && opt.onRender(cur.page);
    }
    function open(page, a, anim) { cur = { page, arg: a, st: { arg: a, pane: "ov", sort: page === "person" ? "new" : page === "thread" ? "top" : undefined, show: {}, open: {}, t: page === "follows" ? (a || "followers") : undefined } }; render(anim); if (!web) root.querySelector(".so-scroll, .so-pscroll")?.scrollTo(0, 0); else scrollTo({ top: 0 }); }

    function back() { if (!stack.length) return void (opt.onClose && opt.onClose()); cur = stack.pop(); render(RM() ? "" : "l"); }
    const setSt = (o, anim = false) => { Object.assign(cur.st, o); render(anim); };

    const onClick = e => {
      const el = e.target.closest("button, [data-thread]"); if (!el || !root.contains(el)) return;
      const d = el.dataset, st = cur.st;
      if (el.hasAttribute("data-back")) return void (opt.back ? opt.back() : back());
      if (d.title) { if (opt.openTitle && opt.openTitle(d.title)) return; return void toast(`${d.title} opens its page. Not in this prototype.`); }
      if (d.ppane) { const ids = ["ov", "mv", "sh", "ph"], dir = ids.indexOf(d.ppane) > ids.indexOf(st.pane) ? "r" : "l"; Object.assign(st, { pane: d.ppane }); render(false);
        const sc = root.querySelector(".so-pscroll"), tb = root.querySelector(".so-tabs"), pn = root.querySelector(".so-pane"); if (sc && tb && sc.scrollTop > tb.offsetTop - 60) sc.scrollTop = tb.offsetTop - 60 - 44;
        if (pn && !RM()) pn.classList.add("in-" + dir); return; }
      if (d.pjump) { const s = root.querySelector("#so-" + d.pjump); root.querySelectorAll(".so-tabs [data-pjump]").forEach((b, i) => { b.setAttribute("aria-selected", b === el); if (b === el) root.querySelector(".so-tabs").style.setProperty("--i", i); }); if (s) scrollTo({ top: s.getBoundingClientRect().top + scrollY - 130, behavior: RM() ? "auto" : "smooth" }); return; }
      if (d.psort) return setSt({ sort: d.psort });
      if (el.hasAttribute("data-bio")) return setSt({ bio: !st.bio });
      if (el.hasAttribute("data-pfav")) { const k = cur.arg || "Tom Cruise"; S.favs[k] = !S.favs[k]; render(false); return void toast(S.favs[k] ? `${cur.arg || "Tom Cruise"} added to your favorite people` : "Removed from your favorite people"); }
      if (el.hasAttribute("data-palert")) { const k = cur.arg || "Tom Cruise"; S.alerts[k] = !S.alerts[k]; render(false); return void toast(S.alerts[k] ? `We'll tell you when a new ${cur.arg || "Tom Cruise"} title is announced` : "Release alerts off"); }
      if (d.nf) return setSt({ f: d.nf });
      if (el.hasAttribute("data-readall")) { S.read = true; render(false); opt.onRead && opt.onRead(); return void toast("All caught up"); }
      if (d.follow) { const u = d.follow, on = S.fol.has(u); on ? S.fol.delete(u) : S.fol.add(u); render(false); return void toast(on ? `You unfollowed @${u}` : `You're following @${u}`); }
      if (d.ep) { S.epDone[d.ep] = !S.epDone[d.ep]; render(false); return void toast(S.epDone[d.ep] ? "Marked as watched" : "Unmarked"); }
      if (el.hasAttribute("data-wlav")) { S.wl.avatar = !S.wl.avatar; render(false); return void toast(S.wl.avatar ? "Avatar: Seven Havens added to your watchlist" : "Removed from your watchlist"); }
      if (d.nlike) { S.likes[d.nlike] = !S.likes[d.nlike]; return render(false); }
      if (d.thread && S.threads[d.thread]) return go("thread", d.thread);
      if (d.csort) return setSt({ sort: d.csort });
      if (d.like) { const c = (function f(L) { for (const x of L) { if ("c" + x.id === d.like) return x; const r = f(x.r || []); if (r) return r; } })(S.threads[st.arg].c);
        S.likes[d.like] = !(d.like in S.likes ? S.likes[d.like] : !!(c && c.me)); return render(false); }
      if (d.rtog) { st.open[d.rtog] = st.open[d.rtog] === false; return render(false); }
      if (d.spo) { st.show[d.spo] = true; return render(false); }
      if (d.reply) { st.to = d.reply; render(false); const i = root.querySelector(".so-comp input"); i && i.focus(); return; }
      if (el.hasAttribute("data-spt")) return setSt({ spo: !st.spo });
      if (d.mf) return setSt({ f: d.mf });
      if (d.ftab) { const dir = d.ftab === "following" ? "r" : "l"; if (d.ftab === st.t) return; Object.assign(st, { t: d.ftab, q: "" }); render(false); const ul = root.querySelector(".so-scroll .so-in"); if (ul && !RM()) ul.classList.add("in-" + dir); root.querySelector(".so-scroll").scrollTop = 0; return; }
      if (d.soon) return void toast(`${d.soon} opens here`);
    };
    const onInput = e => {
      if (e.target.matches("[data-fq]")) return setSt({ q: e.target.value });
      if (e.target.matches(".so-comp input")) { cur.st.draft = e.target.value; const b = root.querySelector(".so-send"); if (b) b.disabled = !e.target.value.trim(); }
    };
    const onSubmit = e => {
      if (!e.target.matches("[data-comp]")) return; e.preventDefault(); const st = cur.st, v = (st.draft || "").trim(); if (!v) return;
      const th = S.threads[st.arg]; const c = { id: Date.now(), a: D.me, b: v, lk: 0, me: 0, d: D.now, sp: !!st.spo, r: [] };
      if (st.to) { const p = th.c.find(x => x.a.n === st.to) || th.c[0]; (p.r = p.r || []).push(c); } else th.c.unshift(c);
      Object.assign(st, { draft: "", to: null, spo: false, sort: "new" }); if (st.spo === false) st.show["c" + c.id] = true; render(false); toast("Comment posted");
    };
    root._soUnbind && root._soUnbind();

  /* ---------- 5. Mark watched (same sequence and timing as the app) ---------- */
  async function flip(render) {

    if (e.target.closest("[data-stback]")) { UI.page = "profile"; saveUI(); syncTabs(); renderProfile(); animate($("#prof")); scrollTo({ top: 0 }); return; }
    const t = e.target.closest("[data-stt]"); if (t && t.dataset.stt !== stTab) { const prev = $(".sttb .ind"); stTab = t.dataset.stt; renderStats();
      const ind = $(".sttb .ind"); requestAnimationFrame(() => { ind.style.transition = ""; }); animate($("#stbody")); return; }
    if (e.target.closest(".rtgo")) return void toast("Your rating queue opens here");
    const cn = e.target.closest("[data-cal]"); if (cn) { tvCal = Math.max(0, Math.min(TVD.months.length - 1, tvCal + +cn.dataset.cal)); renderStats(); return; }
    const r = e.target.closest("[data-range]"); if (r) { stRange = r.dataset.range; renderStats(); return; }
    if (e.target.closest("#ststory")) return void openStory();
    const dy = e.target.closest("[data-day]"); if (dy) return void openDay(dy.dataset.day);
    const dr = e.target.closest("[data-drill]"); if (dr) return void openDrill(dr.dataset.drill, dr.dataset.k, dr.dataset.v, dr.dataset.p);
    const s = e.target.closest("[data-soon-t]"); if (s) toast(`${s.dataset.soonT} isn't part of this prototype`);
  });
  /* ---------- 7. Boot ---------- */
  if (location.hash === "#movies") UI.page = "movies"; else if (location.hash === "#shows") UI.page = "shows"; else if (location.hash === "#profile") UI.page = "profile"; else if (location.hash === "#settings") UI.page = "settings"; else UI.page = "search";   // Discover is the home page
  const onScroll = () => document.body.classList.toggle("scrolled", scrollY > 8); addEventListener("scroll", onScroll, { passive: true }); onScroll();
  syncTabs(); renderMy(); renderUp(); renderMW(); renderMU(); if (UI.page === "profile") renderProfile(); if (UI.page === "settings") renderSettings(); if (UI.page === "search") mountSX(); if (UI.page === "stats") { UI.page = "profile"; syncTabs(); renderProfile(); }
})();

</script>
