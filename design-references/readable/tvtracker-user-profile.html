verflow:ellipsis;padding-right:64px}\n.ucard .count-d{position:absolute;right:12px;bottom:10px;text-align:right;line-height:1}\n.ucard .count-d b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}\n.ucard .count-d small{font-size:10px;color:var(--muted)}\n.ucard .count-d.today b{font-size:20px;color:var(--accent-fg)}\n.uempty{color:var(--muted);font-size:12px;padding:10px 0}\n\n/* ---------- bottom nav + toast ---------- */\n/* Bottom nav (same on every screen) */\n.phone{--nav-h:50px;--safe-bot:34px}.phone[data-device=\"android\"]{--safe-bot:16px}\n/* Bottom bar, Instagram-style: pinned to the bottom edge, full width, solid (no blur, no float), a hairline on top, icons only */\n.bottomnav{position:absolute;left:0;right:0;bottom:0;z-index:4;height:calc(var(--nav-h) + var(--safe-bot));padding:0 8px var(--safe-bot);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--bg-app);border-top:1px solid var(--line)}\n.bottomnav button{height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0;color:var(--text);font:inherit;transition:transform 120ms var(--ease-out)}\n.bottomnav button:active{transform:scale(.9)}\n.bottomnav svg{width:26px;height:26px}\n/* selected tab: amber + the filled version of its icon (Instagram swaps outline \u2192 filled) */\n.bottomnav button > span:last-child{font-size:11px;font-weight:500;letter-spacing:.01em}\n.bottomnav button[aria-current=\"page\"]{color:var(--accent-fg)}   /* active tab = the same outline icon, coloured amber (no fill) */\n.bottomnav button[aria-current=\"page\"] > span:last-child{font-weight:700}\n.bottomnav button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;border-radius:14px}\n.bottomnav .avatar{position:relative;width:26px;height:26px;border-radius:50%;background:var(--ph) center/cover;color:var(--heading);font-weight:700;font-size:11px;display:grid;place-items:center}\n.bottomnav .avatar .dot{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#FF4D5E;box-shadow:0 0 0 2px var(--bg-app)}\n.phone[data-device=\"android\"] .homebar{width:108px;height:4px;opacity:.55}\n.homebar{position:absolute;left:50%;bottom:8px;pointer-events:none;width:134px;height:5px;border-radius:3px;background:var(--text);transform:translateX(-50%);z-index:5;opacity:.9}\n.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--nav-h) + var(--safe-bot) + 10px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:transform 320ms var(--ease-out),opacity 200ms}\n.toast.show{transform:none;opacity:1;pointer-events:auto}\n.toast button{font-weight:800;font-size:12px;color:var(--amber);background:none;border:0;cursor:pointer;padding:4px 6px;letter-spacing:.06em}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n\n/* ---------- dev panel ---------- */\n.panel{width:520px;max-width:100%;background:#0f0f13;border:1px solid var(--line);border-radius:18px;padding:18px;font-size:13px}\n.panel header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}\n.panel h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}\n.panel .eyebrow{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-fg)}\n.ptabs{display:flex;gap:4px;background:#17171d;padding:3px;border-radius:10px}\n.ptabs button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer}\n.ptabs button[aria-selected=\"true\"]{background:#26262e;color:var(--text)}\n.panel h3{font-size:12px;font-weight:700;margin:18px 0 8px;color:var(--text);letter-spacing:.02em}\n.panel p{color:var(--muted);line-height:1.5;margin:0 0 10px}\n.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}\n.panel table{width:100%;border-collapse:collapse;font-size:12px}\n.panel th,.panel td{padding:6px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}\n.panel th{border-top:0;color:var(--muted);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}\n.panel td.name{max-width:150px;overflow:hidden;text-overflow:ellipsis;font-weight:600}\n.panel input[type=number],.panel input[type=date],.panel select{width:54px;background:#17171d;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font:12px var(--font)}\n.panel input[type=date]{width:auto}.panel select{width:auto}\n.panel .field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}\n.panel .field span{color:var(--muted)}\n.panel .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}\n.panel .btn{border:1px solid var(--line);background:#17171d;color:var(--text);border-radius:9px;padding:8px 12px;font-weight:600;font-size:12px;cursor:pointer}\n.panel .btn.primary{background:var(--amber);color:var(--ink);border-color:transparent}\n.panel label.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}\n.panel label.check input{accent-color:var(--amber)}\n.panel code{font:11.5px var(--mono);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:var(--text)}\n.panel .y{color:var(--accent-fg);font-family:var(--mono);font-size:11.5px}\n.panel ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.55}\n.panel li{margin-bottom:4px}\n.panel li b{color:var(--text)}\n\n/* ---------- reduced motion ---------- */\n@media (prefers-reduced-motion:reduce){ :root{--t-move:1ms} }\n.rm .sweep{transform:none!important;opacity:0;transition:opacity 200ms!important}\n.rm .card.s-in .sweep{opacity:1}.rm .card.s-out .sweep{opacity:0}\n.rm .card.prep .info,.rm .card.enter .info{transform:none!important}\n\n/* ---------- List / Grid (see .vbtn at the end of this file) ---------- */\n\n/* view change: quick crossfade + settle */\n.view-in{animation:viewIn 260ms var(--ease-out)}\n@keyframes viewIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}\n\n/* ---------- Grid view ---------- */\n.grid-view{display:flex;flex-direction:column;gap:22px}\n.ghead{display:flex;align-items:baseline;gap:6px;margin:0 0 10px}\n.ghead h2{margin:0;font-family:var(--display);font-size:15.6px;font-weight:800;letter-spacing:.2px;color:var(--heading)}\n#upgrid .ghead h2{font-family:var(--font);font-size:17px;letter-spacing:-.01em;color:var(--text)}\n.ghead .count{font-size:10.2px;color:var(--muted);font-weight:600}\n.ghead .hint{font-size:10.2px;color:var(--muted);margin-left:auto}\n.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;align-items:start}   /* posters always top-aligned (a tile with no status line must not float down) */\n.tile{position:relative;min-width:0}\n.tile .pst{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--ph) center/cover no-repeat;isolation:isolate;box-shadow:0 6px 16px rgba(0,0,0,.35)}\n.tile .pst::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.72));z-index:0;pointer-events:none}\n.tile .ep{position:absolute;left:8px;bottom:7px;z-index:1;font-size:12px;font-weight:800;color:#fff;letter-spacing:.01em;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}\n.tile .tag{position:absolute;left:6px;top:6px;z-index:1;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--amber);font-size:8.5px;font-weight:800;letter-spacing:.1em}\n.tile .tmark{position:absolute;right:6px;bottom:6px;z-index:2;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform 120ms var(--ease-out)}\n.tile .tmark::after{content:\"\";position:absolute;inset:-7px;border-radius:50%}   /* 44\u00d744 touch target */\n.tile .tmark:active{transform:scale(.88)}\n.tile .tmark svg{width:13px;height:10px;display:block}\n.tile .bar{height:5px;border-radius:3px;background:rgba(var(--glass),.1);margin-top:8px;overflow:hidden}\n.tile .bar i{display:block;height:100%;border-radius:3px;background:var(--amber);transition:width 600ms var(--ease-out)}\n.tile .tname{margin-top:6px;font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tile .tsub{margin-top:6px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tile .tsub b{color:var(--accent-fg);font-weight:700}\n/* countdown chip (Upcoming) */\n.tile .cd{position:absolute;right:6px;bottom:6px;z-index:1;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}\n.tile .cd.today{background:var(--amber);color:var(--ink)}\n/* amber sweep on a poster */\n.tile .tsweep{position:absolute;inset:0;z-index:3;background:var(--amber);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform:translateX(-101%);pointer-events:none;text-align:center;padding:0 6px}\n.tile .tsweep .badge{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--amber);display:grid;place-items:center;transform:scale(0)}\n.tile .tsweep .badge svg{width:14px;height:14px}\n.tile .tsweep b{font-size:11px;font-weight:800;letter-spacing:.08em;line-height:1.15;opacity:0}\n.tile .tsweep small{font-size:9.5px;font-weight:700;opacity:0}\n.tile.s-in .tsweep{transform:none;transition:transform var(--t-sweep-in) var(--ease-in-out)}\n.tile.s-in .tsweep .badge{transform:scale(1);transition:transform 420ms var(--spring) 180ms}\n.tile.s-in .tsweep b{opacity:1;transition:opacity 240ms 240ms}\n.tile.s-in .tsweep small{opacity:.72;transition:opacity 240ms 320ms}\n.tile.s-out .tsweep{transform:translateX(101%);transition:transform var(--t-sweep-out) var(--ease-in-out)}\n.tile.s-out .tsweep .badge{transform:scale(1)}.tile.s-out .tsweep b{opacity:1}\n.tile.gone{opacity:0;transform:scale(.92);transition:opacity 220ms,transform 260ms var(--ease-out)}\n.tile.flip{transition:transform var(--t-move) var(--emph)}\n.gempty{color:var(--muted);font-size:12px;padding:6px 0 0}\n.showall.static{position:static;display:block;width:100%;margin-top:14px}\nbutton.tile{display:block;width:100%;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}\nbutton.tile:active .pst{transform:scale(.97)}\nbutton.tile .pst{transition:transform 120ms var(--ease-out)}\n#upgrid .ghead .count{font-size:11px}\n.tile:focus-visible,.tile .tmark:focus-visible {outline:2px solid var(--amber);outline-offset:2px}\n\n/* ---------- List / Grid: slim row under the tabs, icon on the right (no logo bar) ---------- */\n\n.vbtn{position:relative;width:32px;height:32px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;transition:background 160ms,transform 120ms var(--ease-out)}\n.vbtn::after{content:\"\";position:absolute;inset:-6px}                       /* 44\u00d744 touch target */\n.vbtn:hover{background:rgba(var(--glass),.06)}\n.vbtn:active{background:rgba(255,196,46,.12);transform:scale(.92)}\n.vbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}\n.vbtn svg{grid-area:1/1;transition:opacity 180ms var(--ease-out),transform 220ms var(--ease-out)}\n.vbtn .i-list{opacity:0;transform:rotate(-90deg) scale(.6)}\n.vbtn.is-grid .i-grid{opacity:0;transform:rotate(90deg) scale(.6)}\n.vbtn.is-grid .i-list{opacity:1;transform:none}\n.rm .vbtn svg{transition:opacity 120ms}\n\n/* ---------- Screens (Shows / Movies share the same shell) ---------- */\n.screen{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column}\n.screen.enter{animation:viewIn 240ms var(--ease-out)}\n\n/* ---------- Movies ---------- */\n.mhead{display:flex;align-items:center;justify-content:space-between;height:34px;margin:0 0 10px}\n.mhead .mcount{font-family:var(--display);font-size:15.6px;font-weight:800;letter-spacing:.2px;color:var(--heading)}\n.mhead .mcount small{font-family:var(--font);font-size:10.2px;font-weight:600;color:var(--muted);margin-left:6px}\n.mlist{display:flex;flex-direction:column;gap:9px}\n.card.mrow{position:relative;height:84px}\n.card.mrow .info{top:0;bottom:0;right:16px;justify-content:center;gap:3px}\n.card.mrow .title{font-size:13px}\n.card.mrow .year{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}\n.ucard.movie{cursor:default}\n.tile.movie .pst{cursor:default}\n\n/* Poster cards (Upcoming shows, Upcoming movies, Watchlist list).\n   One poster style everywhere: 2:3, rounded, soft shadow (same as the grid posters), never cropped.\n   Background = the same poster blurred, EXACTLY like Upcoming shows (.bd blur 5px, opacity .28 + the same scrim). */\n.ucard{height:136px;align-items:center}\n.ucard .poster{width:80px;height:120px;margin-left:8px;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.35)}   /* 80\u00d7120 = exact 2:3, floating */\n.ucard .bd{top:-8px;height:152px}\n.ucard .uinfo{align-self:stretch;padding:11px 12px 11px 14px}\n.ucard.movie .utitle{margin-top:auto}\n.ucard.mcard .uinfo{justify-content:center}\n.ucard.mcard .utitle{margin-top:0;padding-right:4px}\n.mfacts{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}\n.mfacts i{font-style:normal;color:var(--muted)}\n.mfacts .rate{padding:1px 5px;border:1px solid var(--line-2);border-radius:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;line-height:1.3;color:var(--text)}\n.mgenre{margin-top:4px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:64px}\n.ucard.mcard .mgenre{padding-right:4px}\n\n.tile .tsub.a{font-weight:400;color:var(--muted)}   /* grid: the episode name uses the same normal colour/weight as the list (web + app consistent) */\n.tile .tsub.ename{margin-top:1px;font-weight:400;color:var(--muted)}\n\n/* ---------- Returning (season finished, waiting for the next one) \u2014 same as the website:\n   green status text only (no capsule, no edge), blurred backdrop ---------- */\n:root{--green:#3DDC84;--green-fg:#3DDC84;--purple-fg:#9B7BFF}\n:root[data-theme=\"light\"]{--green-fg:#10813D;--purple-fg:#6D48E0}\n.rcard{position:absolute;left:0;right:0;border-radius:var(--radius-ba);overflow:hidden;background:var(--surface);isolation:isolate}\n.rcard.is-hidden{opacity:0;pointer-events:none}\n.rcard .bdrop{position:absolute;left:-16px;top:-31px;width:calc(100% + 31px);height:147px;z-index:-4;background:center/cover no-repeat;filter:blur(5px);opacity:.28}\n.rcard .scrim{position:absolute;inset:0;z-index:-3;background:linear-gradient(90deg,rgba(61,220,132,.10),rgba(var(--scrim),.3) 35%,rgba(var(--scrim),.5))}\n.rcard .art{position:absolute;left:6px;top:6px;width:110px;height:calc(100% - 12px);border-radius:8px;background:var(--ph) center/cover no-repeat;box-shadow:0 4px 12px rgba(0,0,0,.3)}\n.rcard .info{position:absolute;left:131px;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px}\n.rcard .title{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.rcard .rstat{display:flex;align-items:baseline;gap:6px;min-width:0}\n.rcard .st{color:var(--green-fg);font-weight:700;font-size:11px;white-space:nowrap}\n.rcard .in{color:var(--muted);font-size:10px;white-space:nowrap}\n.tile .bar.g i{background:var(--green)}\n.tile .tsub.g{color:var(--green-fg);font-size:10.5px;letter-spacing:-.2px}\n\n.ucard .uep .left.fin{color:var(--accent-fg);font-weight:800;font-size:9px;letter-spacing:.1em}   /* last episode of the season */\n\n/* ================= Profile (same language as Shows / Movies) ================= */\n.bottomnav button[aria-current=\"page\"] .avatar{box-shadow:0 0 0 2px var(--bg-app),0 0 0 3.5px var(--amber)}\n.pscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(var(--nav-h) + var(--safe-bot) + 28px);scrollbar-width:none}\n.pscroll::-webkit-scrollbar{display:none}\n.phead{position:relative;padding:0 20px}\n.pcover{height:calc(var(--safe-top) + 172px);margin:0 -20px;background:var(--surface) center/cover no-repeat;position:relative}\n.pcover::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(var(--bg-rgb),0) 40%,rgba(var(--bg-rgb),.85) 88%,var(--bg-app) 100%)}\n.pbell,.pmore{position:absolute;top:calc(var(--safe-top) + 2px);z-index:6;height:40px;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:none}\n.pbell{left:16px;width:40px;border-radius:50%;background:rgba(0,0,0,.45)}\n.pmore{right:10px;width:44px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}   /* no circle: bold dots, shadow keeps them readable on any cover */\n.pbell::after{content:\"\";position:absolute;inset:-2px;border-radius:50%}\n.pbell.on{background:var(--amber);color:var(--ink)}   /* new notifications: amber disc, black bell. None: plain */\n.pid{display:flex;align-items:flex-end;gap:18px;margin-top:-36px;position:relative;z-index:1}\n.pav{flex:none;width:72px;height:72px;border-radius:50%;background:var(--ph) center/cover no-repeat;box-shadow:0 0 0 3px var(--bg-app)}\n.pcounts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:2px}\n.pcounts button{border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;justify-content:center;cursor:pointer;padding:0}\n.pcounts b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}\n.pcounts span{font-size:11px;color:var(--muted)}\n.pname{margin:14px 0 0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.2px;color:var(--heading);line-height:1.1}\n.pmeta{display:flex;align-items:center;gap:10px;margin-top:6px}\n.phandle{font-size:13px;color:var(--muted)}\n.plevel{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 9px;border-radius:13px;border:1px solid rgba(255,196,46,.35);background:rgba(255,196,46,.1);color:var(--accent-fg);cursor:pointer;font:inherit;position:relative}\n.plevel::after{content:\"\";position:absolute;inset:-9px -2px}\n.plevel .lv{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}\n.plevel .ln{font-size:11.5px;font-weight:600}\n.plevel i{display:block;width:34px;height:4px;border-radius:2px;background:rgba(255,196,46,.22);overflow:hidden}\n.plevel i b{display:block;height:100%;border-radius:2px;background:var(--amber)}\n.pbio{margin:10px 0 0;font-size:13.5px;line-height:1.4;color:var(--dim)}\n/* stats: a row of cards you swipe; each card opens Statistics (no chevron, no \"see all\") */\n.pstats{display:flex;gap:10px;overflow-x:auto;margin:18px 0 0;padding:0 20px 2px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}\n.pstats::-webkit-scrollbar{display:none}\n.pstats .sc{flex:none;min-width:98px;height:84px;padding:12px 14px;border-radius:var(--radius-card);border:0;background:var(--surface);color:var(--text);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;cursor:pointer;font:inherit;text-align:center;scroll-snap-align:start;transition:transform 120ms var(--ease-out)}\n.pstats .sc:active{transform:scale(.97)}\n.pstats .sc > small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.pstats .sc > b{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}\n.pstats .sc > b,.pstats .tm b{color:var(--accent-fg)}   /* every stat number in brand yellow (near-black in light) */\n.pstats .tm{display:flex;gap:10px;justify-content:center}\n.pstats .tm > span{display:flex;align-items:baseline;gap:1px}\n.pstats .tm b{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}\n.pstats .tm i{font-style:normal;font-size:13px;font-weight:700;color:var(--muted)}\n/* sections */\n.psec{margin-top:24px;padding:0 20px}\n.phd{margin-bottom:10px}\n.phd h2{margin:0;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:17.5px;font-weight:800;letter-spacing:.2px;color:var(--heading)}\n.phd .heart{flex:none;margin-top:1px;width:21px;height:21px}\n.phbtn{display:flex;align-items:center;width:100%;min-height:36px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}\n.phbtn .pgo{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;margin-right:-8px;color:var(--accent-fg)}\n.phbtn:active .pgo{transform:translateX(2px)}\n.plink{margin-left:auto;display:inline-flex;align-items:center;gap:1px;height:30px;padding:0 0 0 10px;border:0;background:none;color:var(--accent-fg);font:inherit;font-size:12px;font-weight:700;cursor:pointer;position:relative}\n.plink::after{content:\"\";position:absolute;inset:-7px -4px}\n.prow{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:0 20px 6px;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:0 20px}\n.prow::-webkit-scrollbar{display:none}\n.ptile{flex:none;width:104px;padding:0;border:0;background:none;cursor:pointer;scroll-snap-align:start}\n.ptile .pst{display:block;aspect-ratio:2/3;border-radius:12px;background:var(--ph) center/cover no-repeat;box-shadow:0 6px 16px rgba(0,0,0,.35)}\n.ptile:active .pst{transform:scale(.97)}\n.pnew{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px dashed rgba(var(--glass),.16);background:none;color:var(--text);cursor:pointer;font:inherit;text-align:left}\n.pnew .plus{width:40px;height:40px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--accent-fg);font-size:22px;font-weight:400}\n.pnew b{display:block;font-size:13.5px;font-weight:700}\n.pnew small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}\n.pchars{display:flex;gap:10px}\n.pchar{flex:none;width:100px;padding:0;border:0;background:none;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font:inherit}\n.pchar .ph{width:76px;height:76px;border-radius:50%;background:var(--ph) center/cover no-repeat;margin-bottom:8px}\n.pchar b{font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}\n.pchar small{font-size:10.5px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}\n/* level sheet */\n.sheet-bg{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.6);opacity:0;transition:opacity 240ms}\n.sheet-bg.on{opacity:1}\n.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;padding:8px 20px calc(var(--safe-bot) + 18px);border-radius:22px 22px 0 0;background:var(--sheet);border-top:1px solid var(--line);transform:translateY(100%);transition:transform 320ms var(--ease-out);scrollbar-width:none}\n.sheet.on{transform:none}\n.sheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(var(--glass),.22);margin:0 auto 12px}\n.lhead{display:flex;align-items:flex-start;gap:10px}\n.lhead h2{margin:0;font-family:var(--display);font-size:19px;font-weight:800;color:var(--heading)}\n.lhead p{margin:4px 0 0;font-size:12px;color:var(--muted)}\n.lclose{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);color:var(--text);font-size:20px;line-height:1;cursor:pointer;position:relative}\n.lclose::after{content:\"\";position:absolute;inset:-6px;border-radius:50%}\n.lbar{height:8px;border-radius:4px;background:rgba(255,196,46,.16);margin-top:16px;overflow:hidden}\n.lbar i{display:block;height:100%;border-radius:4px;background:var(--amber)}\n.lnext{margin:8px 0 0;font-size:12.5px;color:var(--muted)} .lnext b{color:var(--accent-fg)}\n.sheet h3{margin:22px 0 10px;font-family:var(--display);font-size:15.6px;font-weight:800;color:var(--heading);letter-spacing:.2px}\n.lweek{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.lweek .wk{padding:12px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}\n.lweek b{font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}\n.lweek .wk:first-child b{color:var(--accent-fg)}\n.lweek small{font-size:11px;color:var(--muted)}\n.lacts{display:flex;gap:8px;margin-top:10px}\n.lbtn{flex:1;height:44px;border-radius:12px;border:0;background:var(--amber);color:var(--ink);font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:2px}\n.lbtn.ghost{background:var(--surface);color:var(--text)}\n.lsh{display:flex;align-items:center;gap:6px;margin-top:22px}\n.lsh h3{margin:0}\n.lsh .count{font-size:10.2px;color:var(--muted);font-weight:600}\n.lsub{margin:6px 0 8px;font-size:11.5px;color:var(--muted)}\n.lbadges,.lxp{list-style:none;margin:0;padding:0}\n.lbadges li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);margin-bottom:8px}\n.lbadges .bdg{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,196,46,.14);color:var(--accent-fg);display:grid;place-items:center;font-size:16px}\n.lbadges .bt{flex:1;min-width:0}\n.lbadges .bt b{display:block;font-size:13px;font-weight:700}\n.lbadges .bt i{display:block;height:5px;border-radius:3px;background:rgba(var(--glass),.1);margin-top:6px;overflow:hidden}\n.lbadges .bt u{display:block;height:100%;background:var(--amber);border-radius:3px}\n.lbadges small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}\n.lxp li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}\n.lxp li:last-child{border-bottom:0}\n.lxp b{color:var(--accent-fg);font-weight:800}\n.rm .sheet,.rm .sheet-bg{transition:none}\n\n/* status-bar backdrop once the cover has scrolled away (content never runs under the clock) */\n.ptop{position:absolute;left:0;right:0;top:0;height:calc(var(--safe-top) + 46px);z-index:5;background:var(--bg-app);border-bottom:1px solid var(--line);opacity:0;transition:opacity 160ms;pointer-events:none}\n.ptop.on{opacity:1}\n\n/* ================= Profile list pages (Shows \u00b7 Favourite shows \u00b7 Movies \u00b7 Favourite movies \u00b7 Watchlist) =================\n   Pushed over the profile (slides in from the right), bottom nav stays. Same poster tiles as the Shows grid.\n   Bar colour = state, same as the website: amber in progress \u00b7 green returning \u00b7 purple completed. */\n.phone{--purple:#9B7BFF}\n.lpage{position:absolute;left:0;right:0;top:0;bottom:0;padding-bottom:var(--safe-bot);z-index:7;display:flex;flex-direction:column;background:var(--bg-app);transform:translateX(100%);transition:transform 320ms var(--ease-out)}\n.lpage.on{transform:none}\n.lphead{flex:none;height:48px;margin-top:var(--safe-top);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 8px}\n.lpback{width:44px;height:44px;border:0;background:none;color:var(--heading);display:grid;place-items:center;cursor:pointer;padding:0}\n.lphead h1{margin:0;text-align:center;font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:.2px;color:var(--heading);display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden}\n.lphead h1 small{font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}\n.lphead .heart{width:19px;height:19px;flex:none}\n.lpage .tabrow{margin:0 20px 0 21px}\n.lpchips{flex:none;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:5px;padding:10px 20px 2px}\n.lpchips::-webkit-scrollbar{display:none}\n.lpchips .chip{height:30px;padding:0 8px;font-size:10.5px;gap:4px;justify-content:center;min-width:0}\n.lpage .tab small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}\n.lpchips .chip[aria-pressed=\"true\"]{background:var(--heading);color:var(--bg-app);border-color:var(--heading)}\n.lpchips .chip span{font-variant-numeric:tabular-nums;opacity:.7}\n.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--amber)}\n.dot.g{background:var(--green)} .dot.p{background:var(--purple)}\n.lpscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 20px 28px;scrollbar-width:none}\n.lpscroll::-webkit-scrollbar{display:none}\n.lpscroll .tiles{gap:16px 10px}\n.tile .bar.p i{background:var(--purple)}\n.tile .tsub.p{color:var(--purple-fg)}\n.tile .tsub.a2{color:var(--muted);font-weight:500}\n.tile .tsub.a2 b{color:var(--accent-fg)}\n.tile .bar + .tname{margin-top:6px}\n.lpnote{margin:18px 0 0;text-align:center;font-size:11px;color:var(--muted)}\n.lppager{flex:1;min-height:0}\n.lppager > .lpscroll{flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;scroll-snap-stop:always}\n.lpscroll .tiles{gap:14px 10px}\n\n/* =========================================================\n   LIGHT THEME \u2014 same tokens, light values.\n   Rule for the brand yellow on white: amber stays as a FILL (buttons, bars,\n   tab underline, sweeps, badges, dots) with --ink on top; wherever amber was\n   TEXT or an ICON it becomes near-black (--accent-fg), because #FFC42E text\n   on white is ~1.6:1 and unreadable.\n   ========================================================= */\n:root[data-theme=\"light\"]{\n  color-scheme: light;\n  --bg-page:   #e4e5ea;\n  --bg-app:    #f5f5f7;\n  --bg-rgb:    245,245,247;\n  --surface:   #ffffff;\n  --surface-2: #ececf0;\n  --line:      rgba(16,18,27,.09);\n  --text:      #15161c;\n  --heading:   #0e0f14;\n  --muted-2:   #6b7183;\n  --muted:     #5e6476;\n  --accent-fg: #15161c;\n  --glass:     16,18,27;\n  --scrim:     255,255,255;\n  --ph:        #e2e3e9;\n  --sheet:     #ffffff;\n  --sb:        #15161c;\n  --icon:      #3b4050;\n  --dim:       #4a5063;\n  --line-2:    rgba(16,18,27,.28);\n  --toggle-off:#e2e3e8;\n}\n/* things that sit on photography keep the dark look in both themes */\n:root[data-theme=\"light\"] .card.hero{--text:#f4f5f8;--heading:#f4f6ff;--muted:#c9cedc;--accent-fg:var(--amber)}\n:root[data-theme=\"light\"] .card.hero{color:var(--text)}\n:root[data-theme=\"light\"] .card.hero .mark{color:#fff}\n:root[data-theme=\"light\"] .toast{background:#1f2029;color:#f4f5f8;border-color:transparent}\n:root[data-theme=\"light\"] .phone{box-shadow:0 30px 80px rgba(20,22,30,.18)}\n:root[data-theme=\"light\"] .tile .pst,:root[data-theme=\"light\"] .ptile .pst,:root[data-theme=\"light\"] .ucard .poster{box-shadow:0 4px 12px rgba(20,22,30,.16)}\n:root[data-theme=\"light\"] .card:not(.hero) .art,:root[data-theme=\"light\"] .rcard .art{box-shadow:0 3px 10px rgba(20,22,30,.15)}\n:root[data-theme=\"light\"] .card,:root[data-theme=\"light\"] .rcard,:root[data-theme=\"light\"] .ucard{box-shadow:0 1px 2px rgba(20,22,30,.05),0 0 0 1px rgba(16,18,27,.05)}\n:root[data-theme=\"light\"] .plevel{border-color:rgba(214,150,0,.45);background:rgba(255,196,46,.22)}\n:root[data-theme=\"light\"] .lbadges .bdg{background:rgba(255,196,46,.28)}\n:root[data-theme=\"light\"] .sheet-bg{background:rgba(20,22,30,.35)}\n/* profile: the status bar sits on the st below the photo */\n:root[data-theme=\"light\"] .pcover::after{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 72%,rgba(0,0,0,.16) 100%)}\n:root[data-theme=\"light\"] .pav{box-shadow:0 0 0 3px var(--bg-app),0 6px 16px rgba(20,22,30,.18)}\n:root[data-theme=\"light\"] .pcounts{margin-bottom:-6px}\n:root[data-theme=\"light\"] .pcounts button{min-height:40px}\n\n/* light: once the cover has scrolled away (white top bar), \u2022\u2022\u2022 turns dark */\n:root[data-theme=\"light\"] #scr-profile.scrolled .pmore{color:var(--text);filter:none;transition:color 160ms}\n\n\n/* =========================================================\n   Settings \u2014 structure of the shipping iOS app, in OUR design system:\n   list-page header, grouped surface cards, amber icon tiles, iOS toggles,\n   amber segmented controls, theme preview cards. Bottom nav stays.\n   ========================================================= */\n.spage{z-index:8}\n.sptitle{display:flex;flex-direction:column;align-items:center;line-height:1}\n.sptitle h1{margin:0;font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:.2px;color:var(--heading)}\n.sptitle small{margin-top:4px;font-size:9px;font-weight:700;letter-spacing:.22em;color:var(--muted)}\n.sscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 16px 28px;scrollbar-width:none;display:flex;flex-direction:column;gap:22px}\n.sscroll::-webkit-scrollbar{display:none}\n.sscroll.in-r{animation:sIn 300ms var(--ease-out)} .sscroll.in-l{animation:sOut 300ms var(--ease-out)}\n@keyframes sIn{from{transform:translateX(28%);opacity:0}} @keyframes sOut{from{transform:translateX(-22%);opacity:0}}\n@media (prefers-reduced-motion:reduce){.sscroll.in-r,.sscroll.in-l{animation:none}}\n.sgrp{display:flex;flex-direction:column;gap:7px}\n.sgrp h2{margin:0 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.scard{background:var(--surface);border-ra      <div class=\"pchars\">${D.chars.map(([n, a, im]) => `<button class=\"pchar\" type=\"button\" data-soon=\"${esc(n)}\"><span class=\"ph\" style=\"background-image:url('${im}')\"><\/span><b>${esc(n)}<\/b><small>${esc(a)}<\/small><\/button>`).join(\"\")}<\/div><\/section><\/div>`\n    : `<section class=\"psec\"><div class=\"phd\"><button class=\"phbtn\" type=\"button\" data-soon=\"Favourite characters\"><h2>${I.heart}Favourite characters<\/h2><span class=\"pgo\">${I.go}<\/span><\/button><\/div>\n        <div class=\"pchars\">${D.chars.map(([n, a, im]) => `<button class=\"pchar\" type=\"button\" data-soon=\"${esc(n)}\"><span class=\"ph\" style=\"background-image:url('${im}')\"><\/span><b>${esc(n)}<\/b><small>${esc(a)}<\/small><\/button>`).join(\"\")}<\/div><\/section>`;\n  const actors = () => WEB\n    ? `<div class=\"pduo\"><section class=\"psec\"><h2><button class=\"phbtn\" type=\"button\" data-soon=\"Favourite actors\">${I.heart}<span>Favourite actors<\/span><span class=\"pgo\">${I.go}<\/span><\/button><\/h2>\n        <div class=\"pchars\">${D.actors.map(([n, im, a]) => `<button class=\"pchar\" type=\"button\" data-soon=\"${esc(n)}\"><span class=\"ph\" style=\"background-image:url('${im}')\"><\/span><b>${esc(n)}<\/b><small>${esc(a)}<\/small><\/button>`).join(\"\")}<\/div><\/section><\/div>`\n    : `<section class=\"psec\"><div class=\"phd\"><button class=\"phbtn\" type=\"button\" data-soon=\"Favourite actors\"><h2>${I.heart}Favourite actors<\/h2><span class=\"pgo\">${I.go}<\/span><\/button><\/div>\n        <div class=\"pchars\">${D.actors.map(([n, im, a]) => `<button class=\"pchar\" type=\"button\" data-soon=\"${esc(n)}\"><span class=\"ph\" style=\"background-image:url('${im}')\"><\/span><b>${esc(n)}<\/b><small>${esc(a)}<\/small><\/button>`).join(\"\")}<\/div><\/section>`;\n\n  let st = {};\n  function render(s) {\n    st = s;\n    document.documentElement.dataset.theme = s.theme;\n    const priv = s.priv === \"priv\", fol = s.rel === \"fol\", req = s.rel === \"req\", canSee = !priv || fol, show = s.show;\n    const btn = fol ? `<button type=\"button\" class=\"ufb on\" data-act=\"unfollow\">${I.check}Following<\/button>`\n      : req ? `<button type=\"button\" class=\"ufb on\" data-act=\"cancel\">${I.clock}Requested<\/button>`\n      : `<button type=\"button\" class=\"ufb pri\" data-act=\"follow\">${I.plus}${priv ? \"Request to follow\" : U.followsYou ? \"Follow back\" : \"Follow\"}<\/button>`;\n    const mutual = `<p class=\"umut\"><span class=\"ust\">${D.mutual.slice(0, 3).map((n, i) => `<i style=\"background:linear-gradient(140deg,${HUE[i][0]},${HUE[i][1]})\">${esc(n[0].toUpperCase())}<\/i>`).join(\"\")}<\/span><span>Followed by <b>${esc(D.mutual[0])}<\/b>, <b>${esc(D.mutual[1])}<\/b> and ${D.mutual.length - 2} more<\/span><\/p>`;\n    const who = `<div class=\"pwho\"><span class=\"phandle\">@${esc(U.handle)}${U.followsYou ? `<i class=\"ufy\">Follows you<\/i>` : \"\"}<\/span><h1 class=\"pname\">${esc(U.name)}<\/h1><p class=\"pbio\">${esc(U.bio)}<\/p><\/div>`;\n    const avw = `<div class=\"pavw\"><span class=\"pavb\"><span class=\"pav none\">${esc(U.name[0].toUpperCase())}<\/span><\/span><button class=\"plevel\" type=\"button\" data-soon=\"Level ${U.level} \u00b7 ${U.levelName}\" aria-label=\"Level ${U.level}, ${U.levelName}\">LV ${U.level}<\/button><\/div>`;\n    const counts = `<div class=\"pcounts\">${[[\"Followers\", U.followers + (fol ? 1 : 0)], [\"Following\", U.following], [\"Comments\", U.comments]].map(([k, v]) => `<button type=\"button\" data-soon=\"${k}\"><b>${v}<\/b><span>${k}<\/span><\/button>`).join(\"\")}<\/div>`;\n    const stats = `<div class=\"pstats\" role=\"list\" aria-label=\"Statistics\">\n        <button class=\"sc wide\" type=\"button\" role=\"listitem\" data-soon=\"Statistics\">${tcard(\"Show time\", mdh(U.epMin))}<\/button>\n        <button class=\"sc wide\" type=\"button\" role=\"listitem\" data-soon=\"Statistics\">${tcard(\"Movie time\", mdh(U.movieMin))}<\/button>\n        <button class=\"sc\" type=\"button\" role=\"listitem\" data-soon=\"Statistics\"><small>Shows<\/small><b>${fmt(U.shows)}<\/b><\/button>\n        <button class=\"sc\" type=\"button\" role=\"listitem\" data-soon=\"Statistics\"><small>Movies<\/small><b>${fmt(U.movies)}<\/b><\/button>\n        <button class=\"sc\" type=\"button\" role=\"listitem\" data-soon=\"Statistics\"><small>Episodes<\/small><b>${fmt(U.episodes)}<\/b><\/button><\/div>`;\n    const lock = `<section class=\"psec\"><div class=\"ulock\"><span class=\"ulk\">${I.lock}<\/span><b>This account is private<\/b><p>${req ? `Request sent. Once @${esc(U.handle)} accepts, you'll see their lists, shows, movies and stats.` : `Follow @${esc(U.handle)} to see their lists, shows, movies and stats.`}<\/p><\/div><\/section>`;\n    const body = !canSee ? lock : [\n      show.stats ? stats : \"\",\n      show.lists ? listsRow() : \"\",\n      show.shows ? prow(\"shows\", \"Shows\", false, D.shows) : \"\",\n      show.favShows ? prow(\"favShows\", \"Favourite shows\", true, D.favShows) : \"\",\n      show.movies ? prow(\"movies\", \"Movies\", false, D.movies) : \"\",\n      show.favMovies ? prow(\"favMovies\", \"Favourite movies\", true, D.favMovies) : \"\",\n      show.watchlist ? prow(\"watchlist\", \"Watchlist\", false, D.wl) : \"\",\n      show.chars ? chars() : \"\",\n      show.actors ? actors() : \"\"].join(\"\");\n    const cover = `<div class=\"pcover\" style=\"background-image:${canSee ? `url('${T(D.cover, \"w780\")}')` : \"linear-gradient(140deg,#3a2a5c,#14111f)\"}\"><\/div>`;\n    const acts = `<div class=\"uacts\">${btn}<\/div>${mutual}`;\n    const html = WEB\n      ? `${cover}<button class=\"ubk\" type=\"button\" data-soon=\"Back\" aria-label=\"Back\">${I.back}<\/button>\n        <div class=\"pid\">${avw}${who}${counts}<\/div>${acts}${body}`\n      : `<header class=\"phead\">${cover}\n          <div class=\"pid\">${avw}${who}<\/div>${counts}<\/header>${acts}${body}`;\n    const root = document.getElementById(\"root\");\n    root.innerHTML = html;\n    root.classList.remove(\"uin\"); void root.offsetWidth; if (s.anim) root.classList.add(\"uin\");\n  }\n  let tt; const toast = m => { const t = document.getElementById(\"utoast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove(\"on\"), 2200); };\n  document.addEventListener(\"click\", e => {\n    const a = e.target.closest(\"[data-act]\");\n    if (a) { e.preventDefault(); const v = a.dataset.act, n = Object.assign({}, st, { anim: true });\n      if (v === \"follow\") { n.rel = st.priv === \"priv\" ? \"req\" : \"fol\"; toast(n.rel === \"req\" ? `Request sent to @${U.handle}` : `You're following @${U.handle}`); }\n      if (v === \"unfollow\") { n.rel = \"none\"; n.bell = false; toast(`You unfollowed @${U.handle}`); }\n      if (v === \"cancel\") { n.rel = \"none\"; toast(\"Request cancelled\"); }\n      if (v === \"bell\") { n.bell = !st.bell; toast(n.bell ? `We'll tell you when ${U.name} logs something` : \"Activity alerts off\"); }\n      render(n); parent.postMessage({ tvtUp: n }, \"*\"); return; }\n    const so = e.target.closest(\"[data-soon]\"); if (so) toast(so.dataset.soon + \" opens here\");\n  });\n  addEventListener(\"message\", e => { if (e.data && e.data.tvtRender) render(e.data.tvtRender); });\n  const ps = document.querySelector(\".pscroll\");\n  if (ps) ps.addEventListener(\"scroll\", () => { const on = ps.scrollTop > 150; document.getElementById(\"ptop\").classList.toggle(\"on\", on); document.getElementById(\"scr-profile\").classList.toggle(\"scrolled\", on); }, { passive: true });\n  window.__render = render;\n  parent.postMessage({ tvtReady: true }, \"*\");\n})();\n<\/script><\/body><\/html>", "web": "<!doctype html><html lang=\"en\" data-view=\"web\" data-theme=\"dark\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Figtree:wght@400;500;600;700;800&display=swap\"><style>/* Sizes: original 100% design. Breathing room comes from the side gutter (--gut), not from shrinking content. */\n/* =========================================================\n   TVTracker web \u2014 Shows page (desktop / tablet)\n   Same design language as the app prototype: tokens, fonts, cards, posters, motion.\n   ========================================================= */\n:root{\n  --bg:#000; --surface:#15161C; --line:rgba(var(--glass),.08);\n  --amber:#FFC42E; --ink:#1C1400; --text:#F4F5F8; --heading:#F4F6FF; --muted:#9AA3BD; --dim:#C9CEDC;\n  --font:\"Figtree\",system-ui,-apple-system,\"Segoe UI\",sans-serif; --display:\"Archivo\",\"Figtree\",sans-serif;\n  --ease-out:cubic-bezier(.2,0,0,1); --ease-io:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.34,1.56,.64,1);\n  --r-card:16px; --r-row:14px; --r-poster:12px;\n  --maxw:1600px; --gut:clamp(20px,5vw,80px); /* 1512 incl. gutters = 1440 visible content (90% of the original 1680 grid) */\n  --green:#3DDC84; --purple:#9B7BFF;\n  --accent-fg:var(--amber); --glass:255,255,255; --scrim:21,22,28; --bg-rgb:0,0,0; --ph:#22232b; --menu:#111217; --toast:#1d1e26;\n  --surface-2:#1f2029; --muted-2:#8790a8; --toggle-off:#39393d; --green-fg:#3DDC84; --purple-fg:#9B7BFF; --red:#FF453A;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml{background:var(--bg);color-scheme:dark}\nbody{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}\nbutton,input{font:inherit;color:inherit}\na{color:inherit;text-decoration:none}\n:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n.skip{position:absolute;left:-899.1px;top:8px;z-index:50;background:var(--amber);color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:700}\n.skip:focus{left:12px}\n.glow{position:fixed;left:-198px;top:-288px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,178,41,.07),rgba(255,178,41,0));pointer-events:none;z-index:0}\n\n/* ---------- Site header ---------- */\n.site{position:sticky;top:0;z-index:20;height:64px;background:rgba(var(--bg-rgb),.72);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}\n.site-in{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 var(--gut);display:flex;align-items:center;gap:28px}\n.brand{flex:none} .brand img{height:22px;display:block}\n.mainnav{display:flex;align-items:center;gap:2px}\n.mainnav a{display:flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:10px;font-size:14.6px;font-weight:600;color:var(--dim);transition:color .15s,background .15s}\n.dd{position:relative}\n.ddbtn{display:flex;align-items:center;gap:4px;height:36px;padding:0 12px;border:0;border-radius:10px;background:none;font:600 14.6px var(--font);color:var(--dim);cursor:pointer;transition:color .15s,background .15s}\n.ddbtn:hover,.ddbtn[aria-expanded=\"true\"]{color:var(--text);background:rgba(var(--glass),.06)}\n.ddbtn svg{transition:transform .2s var(--ease-out)} .ddbtn[aria-expanded=\"true\"] svg{transform:rotate(180deg)}\n.ddbtn:focus-visible,.ddmenu a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}\n.ddmenu{position:absolute;left:0;top:calc(100% + 10px);z-index:30;min-width:220px;padding:10px;border-radius:16px;background:var(--menu);border:1px solid rgba(var(--glass),.1);box-shadow:0 24px 48px rgba(0,0,0,.55)}\n.ddmenu[hidden]{display:none} .ddmenu.two{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr));gap:6px}\n.ddmenu ul{list-style:none;margin:0;padding:0}\n.ddmenu a{display:flex;align-items:center;min-height:38px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--dim)}\n.mainnav .ddmenu a{height:auto;min-height:38px;padding:0 12px;font-weight:500;font-size:14px}\n.ddmenu a:hover{background:rgba(var(--glass),.06);color:var(--text)}\n.ddh{margin:6px 12px 4px;font-size:11.4px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n.mainnav a:hover{color:var(--text);background:rgba(var(--glass),.06)}\n.mainnav a[aria-current=\"page\"]{color:var(--accent-fg);background:rgba(255,196,46,.12)}\n.mainnav a:focus-visible,.mnav a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}\n.site-r{margin-left:auto;display:flex;align-items:center;gap:8px}\n.gsearch{display:flex;align-items:center;gap:8px;width:340px;height:40px;padding:0 10px 0 12px;border-radius:12px;background:rgba(var(--glass),.05);border:1px solid var(--line);color:var(--muted);transition:border-color .15s,background .15s}\n.gsearch:hover{background:rgba(var(--glass),.07)}\n.gsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;color:var(--text)}\n.gsearch input::placeholder{color:var(--muted)}\n.gsearch kbd{font:600 11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}\n.gsearch:focus-within{border-color:rgba(255,196,46,.55);background:rgba(var(--glass),.07)}\n.iconbtn{position:relative;width:40px;height:40px;border:0;border-radius:12px;background:none;display:grid;place-items:center;color:var(--dim);cursor:pointer;transition:background .15s,color .15s}\n.iconbtn:hover{background:rgba(var(--glass),.06);color:var(--text)}\n.iconbtn:focus-visible,.avatar:focus-visible{outline:2px solid var(--amber);outline-offset:2px}\n.iconbtn .dot{position:absolute;right:9px;top:8px;width:8px;height:8px;border-radius:50%;background:#FF4D5E;box-shadow:0 0 0 2px var(--bg)}\n.menubtn{display:none;margin-left:-7.2px}\n.site{isolation:isolate}\n.mnav{position:absolute;left:0;right:0;top:100%;display:grid;padding:8px var(--gut) 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--menu);box-shadow:0 24px 48px rgba(0,0,0,.6)}\n.mnav[hidden]{display:none}\n.mnav a{display:flex;align-items:center;height:48px;padding:0 12px;border-radius:12px;font-size:16px;font-weight:600;color:var(--dim)}\n.mnav a[aria-current=\"page\"]{color:var(--accent-fg);background:rgba(255,196,46,.12)}\n.avatar{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(var(--glass),.12);background:var(--ph);color:var(--heading);font-weight:700;font-size:13px;cursor:pointer}\n\n/* ---------- Page ---------- */\n.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut) 72px}\n\n/* Page tabs = the app's underline tabs, adapted for web: left-aligned with the content, sized as the page title,\n   indicator only as wide as the word, same size in both states (no layout shift). */\n.toolbar{display:flex;align-items:flex-end;gap:12px;margin:28px 0 28px;border-bottom:1px solid var(--line)}\n.tabs{position:relative;display:flex;gap:36px}\n.tab{position:relative;border:0;background:none;padding:0 0 14px;cursor:pointer;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.2px;line-height:1.15;color:var(--muted);transition:color .2s}\n.tab:hover{color:var(--dim)}\n.tab[aria-selected=\"true\"]{color:var(--accent-fg)}\n.tab::after{content:\"\";position:absolute;inset:-7.2px -9px 0}          /* bigger hit area */\n.tab:focus-visible{outline:2px solid var(--amber);outline-offset:6px;border-radius:6px}\n.ind{position:absolute;left:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--amber);transition:transform .35s var(--ease-out),width .35s var(--ease-out)}\n.toolbar .vbtn{margin-left:auto;margin-bottom:8px}\n.sec-meta{margin:0;font-size:14px;color:var(--muted)} .sec-meta b{color:var(--heading);font-weight:700}   /* tab already names the list \u2192 no repeated title */\n.vbtn{position:relative;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;transition:background .16s,transform .12s var(--ease-out)}\n.vbtn:hover{background:rgba(255,196,46,.1)}\n.vbtn:active{transform:scale(.92)}\n.vbtn svg{grid-area:1/1;transition:opacity .18s var(--ease-out),transform .22s var(--ease-out)}\n.vbtn .i-list{opacity:0;transform:rotate(-90deg) scale(.6)}\n.vbtn.is-grid .i-grid{opacity:0;transform:rotate(90deg) scale(.6)}\n.vbtn.is-grid .i-list{opacity:1;transform:none}\n\n.panel.view-in{animation:viewIn .26s var(--ease-out)}\n@keyframes viewIn{from{opacity:0;transform:translateY(6px) scale(.992)}to{opacity:1;transform:none}}\n\n/* ---------- Sections (My shows) \u2014 same headers as the app ---------- */\n.sec{margin-bottom:40px}\n.sec-h{display:flex;align-items:center;gap:12px;min-height:40px;margin-bottom:14px}\n.sec-h .t{display:flex;flex-direction:column}\n.sec-h h2{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.2px;color:var(--heading)}\n.sec-h .count{font-family:var(--font);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}\n.sec-h .hint{font-size:12.4px;color:var(--muted);margin-top:2px}\n.sec-h .sp{flex:1}\n.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(var(--glass),.1);background:rgba(var(--glass),.06);font-size:13px;font-weight:600;color:var(--heading);cursor:pointer;white-space:nowrap}\n.chip:hover{background:rgba(var(--glass),.1)}\n.link{border:0;background:none;color:var(--accent-fg);font-weight:700;font-size:13.6px;cursor:pointer;padding:8px 6px;border-radius:8px;white-space:nowrap}\n.link:hover{text-decoration:underline;text-underline-offset:3px}\n.chev{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease-out)}\n.chev:hover{background:rgba(var(--glass),.06)}\n.sec.collapsed .chev{transform:rotate(180deg)}\n.sec.collapsed .sec-b{display:none}\n.more-note{margin:12px 0 0;font-size:12.4px;color:var(--muted)}\n\n/* layouts */\n.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}\n.rows{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}\n.posters{display:grid;align-items:start;gap:22px 16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}\n.clip > .item.over{display:none}\n\n/* ---------- Watching now card (desktop version of the app's hero) ---------- */\n.hero{position:relative;height:210px;border-radius:var(--r-card);overflow:hidden;isolation:isolate;background:var(--ph) center/cover no-repeat;box-shadow:0 10px 30px rgba(0,0,0,.4)}\n.hero::before{content:\"\";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,0) 28%,rgba(0,0,0,.88))}\n.hero .info{position:absolute;left:18px;right:78px;bottom:18px;z-index:1}\n.hero .title{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.ep{display:flex;align-items:baseline;gap:8px;margin-top:3px;min-width:0}\n.code{white-space:nowrap}\n.eptitle{min-width:0;flex:1}\n.code{color:var(--accent-fg);font-weight:700;font-variant-numeric:tabular-nums}\n.hero .code{font-size:15px}\n.eptitle{color:var(--dim);font-size:12.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.hero .bar{position:absolute;left:18px;right:18px;bottom:10px;height:5px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.18);z-index:1}\n.hero .info{bottom:26px!important}\n.hero .mark{bottom:24px!important}\n.hero .bar i,.pbar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .6s var(--ease-out)}\n\n/* \u2713 (same as the app: circle + check, 44px) */\n.mark{position:absolute;z-index:2;width:44px;height:44px;border-radius:50%;padding:0;line-height:0;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s var(--ease-out),background .16s}\n.mark:hover{background:rgba(255,196,46,.22);border-color:rgba(255,196,46,.6)}\n.mark:active{transform:scale(.88)}\n.mark svg{width:16px;height:12px}\n.hero .mark{right:16px;bottom:18px}\n\n/* ---------- Row card (Been a while / Returning / Completed) \u2014 floating rounded image, no hard edge ---------- */\n.row{position:relative;height:96px;border-radius:var(--r-row);overflow:hidden;isolation:isolate;background:var(--surface);display:flex;align-items:center}\n.row .bd{position:absolute;inset:-21.6px -14.4px;z-index:-2;background:center/cover no-repeat;filter:blur(5px);opacity:.28}\n.row .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(var(--scrim),.1),rgba(var(--scrim),.275) 35%,rgba(var(--scrim),.45))}\n.row .thumb{flex:none;width:150px;height:84px;margin-left:6px;border-radius:10px;background:var(--ph) center/cover no-repeat;box-shadow:0 4px 12px rgba(0,0,0,.3)}\n.row .info{flex:1;min-width:0;padding:0 64px 0 16px}\n.row .title{font-size:14.6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .code{font-size:13px}\n.row .sub{margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .sub b{color:var(--accent-fg);font-weight:700}\n.row .pbar{margin-top:8px;height:5px;border-radius:3px;border-radius:2px;background:rgba(var(--glass),.1);overflow:hidden;max-width:220px}\n.row .mark{right:14px;top:50%;margin-top:-19.8px;width:40px;height:40px}\n.row .mark::after{content:\"\";position:absolute;inset:-1.8px;border-radius:50%}\n\n/* ---------- Poster tile (Grid view) \u2014 same as the app grid ---------- */\n.tile{position:relative;min-width:0}\n.pst{position:relative;aspect-ratio:2/3;border-radius:var(--r-poster);overflow:hidden;isolation:isolate;background:var(--ph) center/cover no-repeat;box-shadow:0 8px 20px rgba(0,0,0,.4)}\n.pst::after{content:\"\";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,0) 58%,rgba(0,0,0,.7));pointer-events:none}\n.pst .badge{position:absolute;left:9px;bottom:9px;z-index:1;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}\n.pst .tag{position:absolute;left:8px;top:8px;z-index:1;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--amber);font-size:9.6px;font-weight:800;letter-spacing:.1em}\n.pst .cd{position:absolute;right:8px;bottom:8px;z-index:1;padding:5px 8px;border-radius:9px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11.4px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}\n.pst .cd.today{background:var(--amber);color:var(--ink)}\n.pst .mark{right:8px;bottom:8px;width:36px;height:36px}\n.pst .mark::after{content:\"\";position:absolute;inset:-3.6px;border-radius:50%}\n.pst .mark svg{width:14px;height:11px}\n.tile .pbar{height:5px;border-radius:3px;border-radius:2px;background:rgba(var(--glass),.1);overflow:hidden;margin-top:9px}\n.tile .tname{margin-top:7px;font-size:13.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tile .tsub{margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tile .tsub b{color:var(--accent-fg);font-weight:700}\n\n/* ---------- Upcoming card (same as the app: floating 2:3 poster on a blurred poster) ---------- */\n.ugroup{margin-bottom:36px}\n.ucards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}\n.ucard{position:relative;display:flex;align-items:center;height:136px;border-radius:var(--r-row);overflow:hidden;isolation:isolate;background:var(--surface)}\n.ucard .bd{position:absolute;inset:-7.2px -14.4px;z-index:-2;background:center/cover no-repeat;filter:blur(5px);opacity:.28}\n.ucard .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(var(--scrim),.8),rgba(var(--scrim),.64) 23%,rgba(var(--scrim),.8))}\n.ucard .poster{flex:none;width:80px;height:120px;margin-left:8px;border-radius:10px;background:var(--ph) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.35)}\n.ucard .uinfo{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;padding:13px 14px 13px 16px}\n.ucard .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}\n.ucard .ubadge{color:var(--accent-fg);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:12px}\n.ucard .utitle{margin-top:auto;font-size:16px;font-weight:700;line-height:1.25;padding-right:84px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.ucard .code{font-size:14px}\n.ucard .usub{color:var(--muted);font-size:12.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:84px;margin-top:2px}\n.ucard .count-d{position:absolute;right:16px;bottom:13px;text-align:right;line-height:1}\n.ucard .count-d b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}\n.ucard .count-d small{font-size:11.4px;color:var(--muted)}\n.ucard .count-d.today b{font-size:24px;color:var(--accent-fg)}\n.gh{display:flex;align-items:baseline;gap:8px;margin:0 0 14px}\n.gh h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}\n.gh .count{font-size:13px;color:var(--muted);font-weight:600}\n\n/* ---------- Mark watched: the app's amber sweep ---------- */\n.sweep{position:absolute;inset:0;z-index:3;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;transform:translateX(-101%);pointer-events:none;border-radius:inherit}\n.sweep .bdg{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--amber);display:grid;place-items:center;transform:scale(0)}\n.sweep .bdg svg{width:17px;height:17px}\n.sweep b{font-size:15px;font-weight:800;letter-spacing:.08em;opacity:0}\n.pst .sweep{flex-direction:column;gap:8px}\n.pst .sweep b{font-size:12px}\n.s-in .sweep{transform:none;transition:transform .42s var(--ease-io)}\n.s-in .sweep .bdg{transform:scale(1);transition:transform .42s var(--spring) .18s}\n.s-in .sweep b{opacity:1;transition:opacity .24s .24s}\n.s-out .sweep{transform:translateX(101%);transition:transform .46s var(--ease-io)}\n.s-out .sweep .bdg{transform:scale(1)} .s-out .sweep b{opacity:1}\n/* final episode: \"SERIES COMPLETE\" / \"ALL CAUGHT UP\" + the count, same as the app */\n.sweep .wcol{display:flex;flex-direction:column;align-items:flex-start;gap:2px}\n.pst .sweep .wcol{align-items:center;text-align:center;padding:0 8px}\n.sweep small{font-size:12px;font-weight:600;opacity:0;transform:translateY(4px)}\n.sweep small:empty{display:none}\n.pst .sweep small{font-size:10.6px}\n.done .sweep b{letter-spacing:.06em}\n.pst.done .sweep b{font-size:11.4px;line-height:1.15}\n.s-in .sweep small{opacity:.72;transform:none;transition:opacity .26s .36s,transform .36s var(--ease-out) .36s}\n.item.gone{opacity:0;transform:scale(.96);transition:opacity .22s,transform .26s var(--ease-out);pointer-events:none}\n.fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:60;pointer-events:none}\n.item.flip{transition:transform .5s var(--ease-out)}\n\n/* ---------- Misc ---------- */\n.noresult{color:var(--muted);text-align:center;padding:40px 0}\n.empty{color:var(--muted);font-size:13px;padding:6px 0}\n.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--toast);border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:13.6px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .25s var(--ease-out);pointer-events:none}\n.toast.show{opacity:1;transform:translate(-50%,0)}\n\n/* ---------- Responsive ---------- */\n@media (max-width:1180px){ .gsear
