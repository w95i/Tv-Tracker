<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Series page · Website · TVTracker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Figtree:wght@400;500;600;700;800&display=swap"><style>/* TVTracker · title page (movie + series) — app + website. Same language as the actor page:
   black page, Archivo headings, Figtree text, amber accent, 12px curved squares, no pills for actions. */
:root{color-scheme:dark;
  --bg-page:#08070a;--bg:#000;--bg-rgb:0,0,0;--surface:#15161c;--surface-2:#1f2029;--line:rgba(255,255,255,.08);
  --text:#f4f5f8;--heading:#f4f6ff;--muted:#9aa3bd;--muted-2:#8790a8;--dim:#c9cedc;--amber:#ffc42e;--ink:#1c1400;--accent-fg:#ffc42e;
  --glass:255,255,255;--ph:#22232b;--green:#3DDC84;--red:#ff6b6b;--purple:#9B7BFF;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Archivo","Figtree",system-ui,sans-serif;
  --maxw:1600px;--gut:clamp(20px,5vw,80px);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.2,1.4,.4,1)}
:root[data-theme="light"]{color-scheme:light;
  --bg-page:#e4e5ea;--bg:#f5f5f7;--bg-rgb:245,245,247;--surface:#fff;--surface-2:#ececf0;--line:rgba(16,18,27,.09);
  --text:#15161c;--heading:#0e0f14;--muted:#5e6476;--muted-2:#6b7183;--dim:#4a5063;--accent-fg:#8a5d00;--glass:16,18,27;--ph:#e2e3e9;--green:#10813D;--red:#E5242B}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-page);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ---------- shared pieces ---------- */
.tp-kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tp-title{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.05;color:var(--heading);text-wrap:balance}
.tp-meta{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-size:13.5px;font-weight:600;color:var(--muted)}
.tp-meta > span + span::before{content:"·";margin:0 7px;opacity:.6}
.tp-cert{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--dim);box-shadow:inset 0 0 0 1.2px rgba(var(--glass),.32)}
.tp-genres{font-size:13px;color:var(--muted);font-weight:500}

/* status tags: one chip, the colour carries the meaning */
.tp-st{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:700;width:max-content;max-width:100%}
.tp-st svg{width:15px;height:15px;flex:none}
.tp-st small{font-size:12px;font-weight:600;opacity:.75}
.tp-st.soon{color:#ffc42e;background:rgba(255,196,46,.13)}
.tp-st.ret{color:var(--green);background:rgba(61,220,132,.12)}
.tp-st.end{color:var(--dim);background:rgba(var(--glass),.08)}
.tp-st.can{color:var(--red);background:rgba(255,107,107,.12)}
.tp-st i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
:root[data-theme="light"] .tp-st.soon{color:#8a5d00;background:rgba(255,196,46,.22)}

/* actions: calm curved squares — no loud fills, the icon carries the amber */
.tp-acts{display:flex;gap:10px}
.tp-main,.tp-sq{height:50px;border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--text);background:rgba(var(--glass),.09);transition:background .2s,color .2s,transform .12s}
.tp-main{flex:1;min-width:0;padding:0 16px}
.tp-sq{flex:none;width:50px;padding:0}
.tp-main svg,.tp-sq svg{width:20px;height:20px;flex:none}
.tp-main:not(.on) svg{color:var(--accent-fg)}
.tp-main.on,.tp-sq.on{color:#ffc42e;background:rgba(255,196,46,.14)}
.tp-main:active,.tp-sq:active{transform:scale(.97)}
:root[data-theme="light"] .tp-main:not(.on),:root[data-theme="light"] .tp-sq:not(.on){background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.08)}
:root[data-theme="light"] .tp-main.on,:root[data-theme="light"] .tp-sq.on{color:#8a5d00;background:rgba(255,196,46,.22)}
@media (hover:hover){.tp-main:not(.on):hover,.tp-sq:not(.on):hover{background:rgba(var(--glass),.14)}}
/* your line: Watched · Mar 23, 2026 › */
.tp-my{display:flex;align-items:center;gap:4px;margin:14px 0 0;padding:0;border:0;background:none;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;text-align:left}
.tp-my .st{color:#ffc42e}
.tp-my .cv{width:17px;height:17px;color:var(--muted)}
:root[data-theme="light"] .tp-my .st{color:#c58a00}

/* the "…" menu (app sheet + website popover) */
.tp-menu{display:flex;flex-direction:column;gap:8px}
.tp-mh{margin:0 4px 6px;font-family:var(--display);font-size:17px;font-weight:800;color:var(--muted)}
.tp-mi{display:flex;align-items:center;gap:14px;width:100%;height:62px;padding:0 10px;border:0;border-radius:14px;background:rgba(var(--glass),.06);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.tp-mi .ic{flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--accent-fg);background:rgba(255,196,46,.13)}
.tp-mi .ic svg{width:21px;height:21px}
.tp-mi b{font-size:16px;font-weight:700}
.tp-mi.on .ic{color:#ff4d6a;background:rgba(255,77,106,.14)}
@media (hover:hover){.tp-mi:hover{background:rgba(var(--glass),.1)}}
:root[data-theme="light"] .tp-mi{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.07)}

/* ratings: one line — logo · score · (votes), like the TVTracker app */
.tp-rr{display:flex;align-items:center;gap:16px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.tp-rr::-webkit-scrollbar{display:none}
.rr{flex:none;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.rr svg{flex:none;height:17px;width:auto}
.rr .tvtl{flex:none;width:20px;height:20px;border-radius:5px;display:block}
.rr b{font-size:15px;font-weight:700;color:var(--heading)}
.rr small{margin-left:-2px;font-size:13.5px;font-weight:500;color:var(--muted)}
:root[data-theme="light"] .rr .rs{color:#f0b000}
.tvt{font-family:var(--display);font-size:11.5px;font-weight:800;color:var(--heading);white-space:nowrap}.tvt i{font-style:normal;color:#ffc42e}

/* sections */
.tp-sec{margin-top:32px}
.tp-sh{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.tp-sh h2{margin:0;font-family:var(--display);font-size:20px;font-weight:800;color:var(--heading)}
.tp-sh small{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tp-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.tp-row::-webkit-scrollbar{display:none}
.tp-row > *{scroll-snap-align:start}
body:has(.w-page){background:var(--bg)}

/* where to watch */
.tp-lab{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tp-wt{display:flex;flex-wrap:wrap;gap:8px}
.tp-pv{border:0;cursor:pointer;color:var(--text);font:inherit;text-align:left;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 6px;border-radius:12px;background:var(--surface);font-size:14px;font-weight:700}
.tp-pv .pl{flex:none;width:36px;height:36px;border-radius:9px;background:var(--ph) center/cover no-repeat}
.tp-pv small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.tp-pv.cine{padding-left:12px}
.tp-pv.cine svg{width:22px;height:22px;color:var(--accent-fg)}
.tp-pvl{flex:none;width:52px;height:52px;padding:0;border:0;border-radius:13px;background:var(--ph) center/cover no-repeat;cursor:pointer;box-shadow:0 0 0 1px rgba(var(--glass),.1)}
.tp-pvl.net{width:88px;background-color:#fff;background-size:72% auto;background-position:center}
:root[data-theme="light"] .tp-pv{box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.06)}

/* overview: three lines that fade, tap to unfold */
.tp-ov{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:default;font-size:16px}
.tp-ov p{margin:0;line-height:1.55;color:var(--dim);text-wrap:pretty}
.tp-ov.clamp{max-height:calc(1.55em * 3 + 2px);overflow:hidden;cursor:pointer;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 2.4em),rgba(0,0,0,.35) calc(100% - .9em),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 2.4em),rgba(0,0,0,.35) calc(100% - .9em),transparent)}
.tp-tag{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--accent-fg)}

/* cast: portrait cards, crew underneath */
.tp-cast{display:flex;gap:10px}
.tp-pp{flex:none;width:104px;padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer;color:inherit}
.tp-pp span{width:100%;aspect-ratio:2/3;border-radius:12px;margin-bottom:9px;background:var(--ph) center 20%/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(var(--glass),.16)}
.tp-pp b{font-size:13.5px;font-weight:700;line-height:1.25;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-pp small{font-size:12.5px;color:var(--muted);line-height:1.35;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-crew{margin:22px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.tp-crew dt{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tp-crew dd{margin:0;font-size:15px;font-weight:600;line-height:1.4;color:var(--heading)}
.tp-crew dd span{color:var(--muted)}

/* videos + gallery: 16:9 cards */
.tp-vid{flex:none;width:236px;display:flex;flex-direction:column;gap:7px}
.tp-vid .th{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--ph) center/cover no-repeat}
.tp-vid .th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.45))}
.tp-vid .pl{position:absolute;z-index:1;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(10,10,14,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tp-vid .pl svg{width:18px;height:18px;margin-left:2px}
.tp-vid b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-ph{flex:none;width:236px;aspect-ratio:16/9;border:0;padding:0;border-radius:12px;background:var(--ph) center/cover no-repeat;cursor:pointer}

/* details: label column + value, like the TVTracker app */
.tp-facts{margin:22px 0 0;display:flex;flex-direction:column;gap:14px}
.tp-facts div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:baseline}
.tp-facts dt{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tp-facts dd{margin:0;font-size:15.5px;font-weight:700;line-height:1.35;color:var(--heading)}

/* keywords */
.tp-kw{display:flex;flex-wrap:wrap;gap:8px}
.tp-kw i{font-style:normal;font-weight:800;color:var(--accent-fg);margin-right:5px}
.tp-kw button{height:34px;padding:0 13px;border:0;border-radius:10px;font-size:13px;font-weight:600;color:var(--dim);background:rgba(var(--glass),.08);cursor:pointer}
:root[data-theme="light"] .tp-kw button{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.08)}

/* more like this: posters with the title underneath */
.tp-rec{flex:none;width:112px;padding:0;border:0;background:none;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:inherit}
.tp-pst{display:block;width:100%;aspect-ratio:2/3;border-radius:12px;background:var(--ph) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(var(--glass),.14)}
.tp-rec b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* production companies · links · comments */
.tp-pcs{display:flex;flex-direction:column;gap:10px}
.tp-pc{display:flex;align-items:center;gap:14px;width:100%;height:68px;padding:0 14px 0 12px;border:0;border-radius:14px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer;text-align:left;box-shadow:inset 0 0 0 1px rgba(var(--glass),.08)}
.tp-pc .lg{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:#fff center/76% auto no-repeat;color:#15161c;font-size:14px;font-weight:800}
.tp-pc b{flex:1;min-width:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-pc .cv{flex:none;width:18px;height:18px;color:var(--muted)}
:root[data-theme="light"] .tp-pc{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.07)}
:root[data-theme="light"] .tp-pc .lg{box-shadow:0 0 0 1px rgba(16,18,27,.08)}
.tp-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tp-links a{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-fg);box-shadow:inset 0 0 0 1px rgba(var(--glass),.12)}
.tp-links a i{font-style:normal;font-size:11px;opacity:.8}
:root[data-theme="light"] .tp-links a:not(.pw-lk){background:#fff}
.tp-cbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 22px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:#4f6bed;cursor:pointer;box-shadow:0 12px 30px -10px rgba(79,107,237,.6)}
.tp-cbtn svg{width:20px;height:20px}
.tp-cbtn i{font-style:normal;min-width:24px;height:24px;padding:0 7px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.22)}
.tp-cwrap{display:flex;justify-content:center;margin-top:30px}
.tp-conv{margin-top:36px;display:flex;align-items:center;gap:16px;padding:18px 18px 18px 20px;border-radius:16px;background:rgba(79,107,237,.1);box-shadow:inset 0 0 0 1px rgba(79,107,237,.28)}
.tp-conv .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:#4f6bed}
.tp-conv .ic svg{width:22px;height:22px}
.tp-conv .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tp-conv b{font-family:var(--display);font-size:18px;font-weight:800;color:var(--heading)}
.tp-conv small{font-size:14px;color:var(--muted)}
.tp-conv .tp-cbtn{height:46px;font-size:15px;box-shadow:none}

/* up next (series you're watching) — the home "Watching now" card */
.tp-next{margin-top:16px;display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--surface)}
.tp-next .im{flex:none;width:112px;aspect-ratio:16/9;border-radius:10px;background:var(--ph) center/cover no-repeat}
.tp-next .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tp-next small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tp-next b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-next em{font-style:normal;color:var(--accent-fg);font-weight:800;margin-right:6px}
.tp-bar{height:4px;border-radius:2px;background:rgba(var(--glass),.12);overflow:hidden;margin-top:4px}
.tp-bar i{display:block;height:100%;border-radius:2px;background:var(--amber)}
.tp-next .pc{font-size:11.5px;font-weight:600;color:var(--muted)}
:root[data-theme="light"] .tp-next{box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.06)}

/* episodes */
.tp-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tp-tabs::-webkit-scrollbar{display:none}
.tp-tabs button{position:relative;flex:none;height:40px;padding:0;border:0;background:none;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.tp-tabs button[aria-selected="true"]{color:var(--accent-fg);font-weight:700}
.tp-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--amber)}
.tp-sm{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--muted)}
.tp-sm button{margin-left:auto;height:32px;padding:0 12px;border:0;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--text);background:rgba(var(--glass),.09);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tp-sm button svg{width:15px;height:15px}
.tp-sm button.on{color:#ffc42e;background:rgba(255,196,46,.14)}
.tp-eps{display:flex;flex-direction:column;gap:8px}
.tp-ep{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:14px;background:var(--surface)}
.tp-ep .im{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:9px;background:var(--ph) center/cover no-repeat}
.tp-ep .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tp-ep .tx b{font-size:14px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp-ep .tx b em{font-style:normal;color:var(--accent-fg);margin-right:5px}
.tp-ep .tx small{font-size:12px;color:var(--muted);font-weight:500}
.tp-ep .tx small i{font-style:normal;color:var(--dim);font-weight:700}
.tp-ck{flex:none;width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--text);background:rgba(var(--glass),.08);box-shadow:inset 0 0 0 1.5px rgba(var(--glass),.22);transition:background .2s,transform .15s var(--spring)}
.tp-ck svg{width:17px;height:17px}
.tp-ck.on{color:var(--ink);background:var(--amber);box-shadow:none}
.tp-ck:active{transform:scale(.88)}
.tp-air{flex:none;height:26px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:#ffc42e;background:rgba(255,196,46,.13)}
.tp-ep.seen .tx b{color:var(--dim)}
:root[data-theme="light"] .tp-ep{box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.06)}
:root[data-theme="light"] .tp-air{color:#8a5d00;background:rgba(255,196,46,.22)}

.tp-toast{position:fixed;left:50%;bottom:110px;z-index:90;transform:translate(-50%,14px);opacity:0;padding:11px 16px;border-radius:13px;background:#1f2029;color:#f4f5f8;font-size:13.5px;font-weight:600;white-space:nowrap;transition:all .3s var(--ease);pointer-events:none}
.tp-toast.on{opacity:1;transform:translate(-50%,0)}

/* ======================= TITLE (text or logo artwork) ======================= */
.tp-logo{display:block;line-height:0}
.tp-logo img{display:block;max-width:100%;object-fit:contain;object-position:left center}

/* ======================= APP (phone) ======================= */
.app-stage{display:flex;justify-content:center;padding:24px 16px 40px}
.phone{position:relative;width:402px;height:874px;max-width:100%;border-radius:48px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #1b1b1f,0 30px 80px rgba(0,0,0,.6);isolation:isolate}
:root[data-theme="light"] .phone{box-shadow:0 0 0 10px #1b1b1f,0 30px 80px rgba(20,22,30,.25)}
.sbar{position:absolute;z-index:30;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 48px;font-weight:600;font-size:17px;color:#fff;pointer-events:none;transition:color .2s}
.sbar .cam{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sbar .ic{display:flex;gap:6px;align-items:center}
:root[data-theme="light"] .phone.solid .sbar{color:#15161c}
.a-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px}
.a-scroll::-webkit-scrollbar{display:none}
.a-top{position:absolute;z-index:20;top:0;left:0;right:0;height:104px;padding:56px 10px 0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;transition:background .25s,box-shadow .25s}
.solid .a-top{background:var(--bg);box-shadow:0 1px 0 var(--line)}
.a-ib{width:44px;height:44px;border:0;padding:0;background:none;display:grid;place-items:center;color:#fff;cursor:pointer;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.a-ib svg{width:24px;height:24px}
.solid .a-ib{color:var(--heading);filter:none}
.a-tt{justify-self:center;display:inline-flex;align-items:center;gap:9px;min-width:0;max-width:100%;font-size:16px;font-weight:700;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s var(--ease)}
.a-tt i{flex:none;width:22px;height:33px;border-radius:5px;background:var(--ph) center/cover no-repeat}
.a-tt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.solid .a-tt{opacity:1;transform:none}
/* hero: the backdrop runs under the status bar and melts into the page */
.a-hero{position:relative;height:330px}
.a-hero .bd{position:absolute;inset:0;background:var(--ph) center 22%/cover no-repeat}
.a-hero{cursor:pointer;overflow:hidden}
.a-hero .yt{position:absolute;left:50%;top:0;height:100%;aspect-ratio:16/9;transform:translateX(-50%) scale(1.35);border:0;pointer-events:none}
.a-hero .ks{position:absolute;inset:0;overflow:hidden}
/* opened as a local file YouTube won't play, so the cover runs the trailer's stills instead */
.a-hero .ks i{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;animation:ks 20s linear infinite}
.a-hero .ks i:first-child{opacity:1}
@keyframes ks{0%{opacity:0;transform:scale(1.04)}4%{opacity:1}20%{opacity:1}26%{opacity:0;transform:scale(1.14)}100%{opacity:0}}
.a-hero .bd,.a-hero .yt,.a-hero .ks{transition:filter .5s var(--ease)}
.a-hero:not(.play) .ks{filter:blur(14px) saturate(1.1);transform:scale(1.12)}
.a-hero:not(.play) .bd,.a-hero:not(.play) .yt{filter:blur(14px) saturate(1.1)}
.a-hero:not(.play) .bd{transform:scale(1.12)}
.a-trh{position:absolute;z-index:3;left:50%;top:150px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;border-radius:11px;font-size:13px;font-weight:700;color:#fff;background:rgba(10,10,14,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);white-space:nowrap}
.a-trh svg{width:14px;height:14px}
.a-hero .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 26%,rgba(var(--bg-rgb),.35) 58%,rgba(var(--bg-rgb),.9) 86%,var(--bg) 100%)}
/* head: poster left, title + facts right */
.a-head{position:relative;z-index:2;margin-top:-118px;padding:0 20px;display:flex;align-items:flex-start;gap:18px}
.a-head .po{flex:none;width:128px;aspect-ratio:2/3;border-radius:14px;background:var(--ph) center/cover no-repeat;box-shadow:0 18px 40px -14px rgba(0,0,0,.75),0 0 0 1px rgba(var(--glass),.14)}
.a-head .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:44px}
.a-head .tp-title{font-size:22px;line-height:1.12;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.a-head .tp-logo{display:block;margin-bottom:2px}
.h-k{margin:2px 0 0;line-height:1.45;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h-p{margin:-3px 0 0;font-size:14.5px;font-weight:700;color:var(--dim);line-height:1.3}
.h-g{margin:0;font-size:13.5px;font-weight:600;color:var(--dim);line-height:1.35}
.h-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:4px}
.tp-tr{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:10px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:rgba(var(--glass),.12)}
.tp-tr svg{width:14px;height:14px}
:root[data-theme="light"] .tp-tr{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.1)}
.h-rt{font-size:14px;font-weight:600;color:var(--dim)}
.h-row .tp-st{height:30px}
.a-body{padding:22px 20px 0}
.a-body .tp-rr{margin:0 -20px 20px;padding:0 20px}
.a-body .tp-next{margin-top:18px}
.a-body .tp-tag + .tp-ov,.a-body .tp-ov{margin-top:0}
.a-body > .tp-tag{margin-top:18px}
.a-body > .tp-my + .tp-ov,.a-body > .tp-acts + .tp-ov{margin-top:18px}
.a-body .tp-my + .tp-tag{margin-top:16px}
.a-body .tp-next + .tp-tag{margin-top:18px}
.a-body .tp-row{margin:0 -20px;padding:0 20px 4px;scroll-padding:0 20px}
.a-body .tp-vid{width:250px}
.a-body .tp-ph{width:250px}
.tp-acts.one .tp-main{flex:1}
/* app "…" sheet */
.a-sheet{position:absolute;inset:0;z-index:40;pointer-events:none}
.a-sheet .scrim{position:absolute;inset:0;border:0;padding:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
.a-sheet .sh-in{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 12px 22px;border-radius:30px;background:#141522;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 -20px 60px rgba(0,0,0,.5);transform:translateY(110%);transition:transform .35s var(--ease)}
:root[data-theme="light"] .a-sheet .sh-in{background:#f5f5f7;box-shadow:0 -20px 60px rgba(20,22,30,.2)}
.a-sheet .grab{display:block;width:38px;height:5px;margin:0 auto 14px;border-radius:3px;background:rgba(var(--glass),.25)}
.a-sheet.on{pointer-events:auto}.a-sheet.on .scrim{opacity:1}.a-sheet.on .sh-in{transform:none}
.a-nav{position:absolute;z-index:25;left:0;right:0;bottom:0;height:84px;padding:0 8px 34px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;background:var(--bg);border-top:1px solid var(--line)}
.a-nav button{height:50px;border:0;background:none;display:grid;place-items:center;color:var(--text);cursor:pointer;padding:0}
.a-nav button svg{width:26px;height:26px}
.a-nav .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);background:var(--amber)}
.a-home{position:absolute;z-index:26;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);opacity:.9}

/* ======================= WEBSITE (tvtracker.tv layout) ======================= */
/* header: clear over the cover, solid once you scroll — same as the actor page */
.w-site{position:sticky;top:0;z-index:40;height:64px;background:transparent;border-bottom:1px solid transparent;transition:background-color .25s,border-color .25s}
.w-site.solid{background:var(--bg);border-bottom-color:var(--line)}
.w-site .in{position:relative;max-width:var(--maxw);height:100%;margin:0 auto;padding:0 var(--gut);display:flex;align-items:center}
.w-logo{height:22px;width:auto;display:block}
.w-logo.l{display:none}
:root[data-theme="light"] .w-logo.d{display:none}
:root[data-theme="light"] .w-logo.l{display:block}
.w-nav{position:absolute;left:50%;top:0;height:64px;transform:translateX(-50%);display:flex}
.w-nav a{position:relative;display:flex;align-items:center;gap:8px;height:64px;padding:0 14px;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.w-nav a svg{width:21px;height:21px}
.w-nav a.cur{color:var(--accent-fg);font-weight:700}
.w-nav a.cur::after{content:"";position:absolute;left:14px;right:14px;bottom:10px;height:2px;border-radius:2px;background:var(--amber)}
.w-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.w-r .bell{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--glass),.08)}
.w-r .bell svg{width:20px;height:20px}
.w-r .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--ink);background:var(--amber);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--amber)}
.w-page{position:relative;max-width:var(--maxw);margin:0 auto;padding:0 var(--gut) 110px}
.w-bd,.w-sh{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:-64px;height:720px;pointer-events:none}
.w-bd{background:center 22%/cover no-repeat;opacity:.9}
.w-sh{background:linear-gradient(90deg,rgba(var(--bg-rgb),.97) 0%,rgba(var(--bg-rgb),.82) 28%,rgba(var(--bg-rgb),.3) 62%,rgba(var(--bg-rgb),.15) 100%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(var(--bg-rgb),0) 22%,rgba(var(--bg-rgb),.55) 66%,var(--bg) 100%)}
.w-grid{position:relative;z-index:1;display:grid;grid-template-columns:270px minmax(0,1fr);gap:56px;align-items:start;padding-top:32px}
.w-side{position:sticky;top:88px;display:flex;flex-direction:column;align-items:center;gap:14px}
.w-po{width:270px;aspect-ratio:2/3;border-radius:16px;background:var(--ph) center/cover no-repeat;box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(var(--glass),.16)}
.w-cap{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-fg);text-align:center}
.w-cap .st{color:inherit}
.w-main{min-width:0}
.w-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:760px;padding-top:8px}
.w-head .tp-kick{color:var(--dim)}
.w-head .tp-title{font-size:clamp(40px,4.4vw,58px)}
.w-tag{margin:-2px 0 0;font-size:17px;font-weight:700;color:var(--accent-fg)}
.w-meta{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;font-size:14.5px;font-weight:600;color:var(--dim)}
.w-meta > span + span::before{content:"·";margin:0 9px;opacity:.6}
.w-meta .gl{color:var(--accent-fg);cursor:pointer}
.w-meta .tp-st{margin-left:14px;height:28px}
.w-head .tp-rr{margin-top:4px;gap:22px}.w-head .rr svg{height:19px}.w-head .rr .rs svg{width:21px;height:21px}.w-head .rr b{font-size:16.5px}.w-head .rr small{font-size:14.5px}
.w-head .tp-ov{max-width:70ch}
.w-head .tp-acts{margin-top:6px;flex-wrap:wrap}
.w-head .tp-main{flex:none;padding:0 20px}
.w-main .tp-next{max-width:560px;margin-top:8px}
.w-main .tp-sec{margin-top:40px}
.w-main .tp-sh h2{font-size:24px}

.w-main .tp-row{overflow:visible}
.w-main .tp-cast{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:14px}
.w-main .tp-cast .tp-pp:nth-child(n+10){display:none}
.w-main .tp-pp{width:auto}
.w-main .tp-crew{grid-template-columns:repeat(4,minmax(0,1fr))}
.w-main .tp-gal,.w-main .tp-vids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.w-main .tp-ph,.w-main .tp-vid{width:auto}
.w-main .tp-recs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
.w-main .tp-recs .tp-rec:nth-child(n+9){display:none}
.w-main .tp-rec{width:auto}
.w-main .tp-rec b{display:none}
.w-main .tp-pcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:1000px}
.w-main .tp-pc .cv{display:none}
.w-head .tp-acts{position:relative}
.tp-mw{position:relative}
.tp-mw .tp-menu{position:absolute;z-index:30;top:58px;left:0;width:340px;padding:12px;border-radius:20px;background:#141522;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 24px 60px rgba(0,0,0,.55)}
:root[data-theme="light"] .tp-mw .tp-menu{background:#f5f5f7;box-shadow:0 0 0 1px rgba(16,18,27,.08),0 24px 60px rgba(20,22,30,.2)}
.w-main .tp-eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.w-main .tp-ep .im{width:136px}
.w-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.w-two .tp-facts{margin:0;gap:0}
.w-two .tp-facts div{grid-template-columns:150px minmax(0,1fr);padding:11px 0;border-bottom:1px solid var(--line)}
.w-two .tp-facts dd{font-size:14.5px;text-align:right}
@media (hover:hover){.w-main .tp-pst,.w-main .tp-ph,.w-main .tp-vid .th,.w-main .tp-pp span{transition:transform .3s var(--spring)}.w-main .tp-pst:hover,.w-main .tp-ph:hover,.w-main .tp-vid:hover .th,.w-main .tp-pp:hover span{transform:translateY(-4px)}}
@media (max-width:1100px){:root{--gut:24px}.w-main .tp-cast{grid-template-columns:repeat(6,minmax(0,1fr))}.w-main .tp-cast .tp-pp:nth-child(n+7){display:none}.w-main .tp-recs{grid-template-columns:repeat(5,minmax(0,1fr))}.w-main .tp-recs .tp-rec:nth-child(n+6){display:none}.w-main .tp-crew{grid-template-columns:repeat(2,minmax(0,1fr))}.w-two{grid-template-columns:1fr}.w-main .tp-eps{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){:root{--gut:16px}.w-grid{grid-template-columns:1fr;gap:20px}.w-side{position:static;align-items:flex-start}.w-po{width:200px}.w-nav{display:none}.w-main .tp-pcs{grid-template-columns:1fr}.w-main .tp-gal,.w-main .tp-vids{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ======================= preview controls (not part of the design) ======================= */
.ctl{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;padding:10px 16px;background:#111216;border-bottom:1px solid rgba(255,255,255,.08);color:#f4f5f8;font-family:var(--font)}
.ctl.float{position:fixed;top:auto;bottom:16px;left:50%;transform:translateX(-50%);border-radius:16px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 50px rgba(0,0,0,.5);width:max-content;max-width:calc(100vw - 32px)}
.ctl > b{font-family:var(--display);font-size:14px}
.seg{display:inline-flex;align-items:center;padding:3px;border-radius:11px;background:rgba(255,255,255,.08)}
.seg small{font-size:10.5px;font-weight:800;color:#8a90a3;margin:0 6px 0 7px;letter-spacing:.07em;text-transform:uppercase}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:#c9cedc;cursor:pointer}
.seg button[aria-pressed="true"]{background:#f4f5f8;color:#111}
.ctl .hide{display:none}


/* ===== round 3 fixes ===== */
/* labels + values: one family, sentence case. The label steps back by colour and size only (no caps, no tracking) */
.tp-crew dt,.tp-facts dt,.tp-lab{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.tp-crew dd{font-size:14.5px;font-weight:600;color:var(--text)}
.tp-facts dd{font-size:14.5px;font-weight:600;color:var(--text)}
.tp-facts div{grid-template-columns:120px minmax(0,1fr)}
.tp-facts{gap:11px}
.tp-lab{margin:0 0 8px}
/* website details: a light two-column list, values beside their label */
.w-two .tp-facts{gap:0}
.w-two .tp-facts div{grid-template-columns:150px minmax(0,1fr);padding:9px 0;border-bottom:1px solid var(--line)}
.w-two .tp-facts div:last-child{border-bottom:0}
.w-two .tp-facts dd{font-size:14px;text-align:left}
.w-two .tp-facts dt{font-size:13px}
.w-two{gap:56px}
/* status sits under the poster on the website */
.w-side .tp-st{align-self:center;height:30px}
/* the two state buttons keep one width whatever they say */
.w-head .tp-main.fx{min-width:196px}
/* website "…" menu: our dropdown, small */
.tp-mw .tp-menu{top:58px;left:0;width:auto;min-width:236px;padding:8px;gap:2px;border-radius:16px;background:var(--menu,#111217);box-shadow:0 0 0 1px rgba(var(--glass),.1),0 24px 48px rgba(0,0,0,.55)}
.tp-mw .tp-mi{height:40px;padding:0 10px;gap:10px;border-radius:10px;background:none}
.tp-mw .tp-mi .ic{width:auto;height:auto;background:none;color:var(--muted)}
.tp-mw .tp-mi .ic svg{width:18px;height:18px}
.tp-mw .tp-mi b{font-size:14px;font-weight:500;color:var(--dim)}
.tp-mw .tp-mi.on .ic{background:none;color:#ff4d6a}
@media (hover:hover){.tp-mw .tp-mi:hover{background:rgba(var(--glass),.06)}.tp-mw .tp-mi:hover b{color:var(--text)}}
:root[data-theme="light"] .tp-mw .tp-mi{box-shadow:none;background:none}
:root[data-theme="light"] .tp-mw .tp-menu{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.08),0 20px 44px rgba(20,22,30,.16)}
/* website cast: one row you can scroll */
.w-main .tp-cast{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.w-main .tp-cast::-webkit-scrollbar{display:none}
.w-main .tp-cast .tp-pp{flex:none;width:128px;display:flex!important}

/* ===== round 4 ===== */
/* ended = our "completed" purple */
.tp-st.end{color:#9B7BFF;background:rgba(155,123,255,.14)}
:root[data-theme="light"] .tp-st.end{color:#6D48E0;background:rgba(109,72,224,.12)}
/* seasons: one chip each — the colour tells you where you are (purple done · amber watching · grey not started) */
.tp-seas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:2px 0}
.tp-seas::-webkit-scrollbar{display:none}
.tp-seas button{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--dim);background:rgba(var(--glass),.06);box-shadow:inset 0 0 0 1px rgba(var(--glass),.1)}
.tp-seas i{box-sizing:border-box;width:8px;height:8px;border-radius:50%;flex:none;border:1.6px solid currentColor}
.tp-seas small{font-size:12.5px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.tp-seas .done{color:#9B7BFF;background:rgba(155,123,255,.1);box-shadow:inset 0 0 0 1px rgba(155,123,255,.3)}
.tp-seas .done i,.tp-seas .prog i{background:currentColor}
.tp-seas .prog{color:#ffc42e;background:rgba(255,196,46,.1);box-shadow:inset 0 0 0 1px rgba(255,196,46,.3)}
.tp-seas [aria-selected="true"]{color:#1c1400;background:#ffc42e;box-shadow:none}
.tp-seas .done[aria-selected="true"]{color:#fff;background:#9B7BFF}
.tp-seas .none[aria-selected="true"]{color:var(--bg);background:var(--text)}
.tp-seas [aria-selected="true"] small{opacity:.8}
:root[data-theme="light"] .tp-seas .done{color:#6D48E0}
:root[data-theme="light"] .tp-seas .prog{color:#8a5d00;background:rgba(255,196,46,.18)}
:root[data-theme="light"] .tp-seas .prog[aria-selected="true"]{color:#1c1400;background:#ffc42e}
:root[data-theme="light"] .tp-seas .done[aria-selected="true"]{color:#fff;background:#7B5CF0}
/* episode: code line + title only, on our blurred "Watching now" card */
.tp-ep{position:relative;isolation:isolate;overflow:hidden}
.tp-ep .bdr{position:absolute;left:-16px;top:-31px;width:calc(100% + 31px);height:147px;z-index:-2;background:center/cover no-repeat;filter:blur(5px);opacity:.28}
.tp-ep .scr{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(21,22,28,.10) 0%,rgba(21,22,28,.275) 35%,rgba(21,22,28,.45) 100%)}
:root[data-theme="light"] .tp-ep .bdr{opacity:.6}
:root[data-theme="light"] .tp-ep .scr{background:linear-gradient(90deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.42) 35%,rgba(255,255,255,.6) 100%)}
.tp-ep .tx{gap:4px}
.tp-ep .tx small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tp-ep .tx small em{font-style:normal;font-weight:800;letter-spacing:.02em;color:var(--accent-fg)}
.tp-ep .tx small i{font-style:normal;opacity:.6;color:var(--muted);font-weight:600}
.tp-ep .tx b{font-size:15px}
.w-main .tp-next{margin-top:22px}
.tp-seas{flex-wrap:wrap;overflow:visible}

/* ===== round 5 ===== */
/* episode check: the same round mark as the Shows page (dark: glass ring · light: amber tick on frosted white) */
.tp-ck{width:38px;height:38px;border-radius:50%;border:1px solid rgba(var(--glass),.12);background:rgba(var(--glass),.06);box-shadow:none;color:var(--text);padding:0;line-height:0;transition:transform 120ms var(--ease),background 160ms}
.tp-ck svg{width:16px;height:12px;display:block}
.tp-ck:hover{background:rgba(var(--glass),.12)}
.tp-ck:active{transform:scale(.88)}
.tp-ck.on{color:var(--ink);background:var(--amber);border-color:var(--amber)}
:root[data-theme="light"] .tp-ck:not(.on){color:var(--amber);border-color:rgba(16,18,27,.2);background:rgba(255,255,255,.62)}
:root[data-theme="light"] .tp-ck:not(.on) svg{filter:drop-shadow(0 0 .6px rgba(60,40,0,.85)) drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.w-page .tp-ck:not(.on){width:40px;height:40px;border-color:rgba(255,255,255,.2);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}
.w-page .tp-ck.on{width:40px;height:40px}
.w-page .tp-ck:not(.on):hover{background:rgba(255,196,46,.22);border-color:rgba(255,196,46,.6)}
:root[data-theme="light"] .w-page .tp-ck:not(.on){color:var(--amber);background:rgba(255,255,255,.62);border-color:rgba(16,18,27,.2);-webkit-backdrop-filter:none;backdrop-filter:none}
/* episode code: "S03 E06", the Shows page size */
.tp-ep .tx small em{font-size:12.5px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.w-page .tp-ep .tx small em{font-size:13px}
/* more like this = the Trending movies poster (app 104 · web 128); gallery + videos share that row height */
.tp-rec{width:104px}
.a-body .tp-recs{gap:10px}
.a-body .tp-ph,.a-body .tp-vid{width:277px}
.a-body .tp-gal,.a-body .tp-vids{gap:10px}
.w-main .tp-recs,.w-main .tp-gal,.w-main .tp-vids{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.w-main .tp-recs::-webkit-scrollbar,.w-main .tp-gal::-webkit-scrollbar,.w-main .tp-vids::-webkit-scrollbar{display:none}
.w-main .tp-rec{flex:none;width:128px;display:flex!important}
.w-main .tp-ph,.w-main .tp-vid{flex:none;width:341px}
/* confetti canvas */
.tp-fx{position:absolute;inset:0;z-index:60;width:100%;height:100%;pointer-events:none}
body > .tp-fx{position:fixed}
.tp-mw .tp-mi b{white-space:nowrap}.tp-mw .tp-menu{min-width:250px}

/* ---------- round 6 · app head like the reference: big poster, details beside it, Overview / Episodes tabs ---------- */
.a-top{grid-template-columns:44px 1fr 88px}
.a-rt{display:flex;justify-content:flex-end}
.a-fav.on{color:var(--red)}
.solid .a-fav.on{color:var(--red)}
.a-hero{height:262px}
.a-trh{top:126px}
.a-mute{position:absolute;z-index:3;right:16px;bottom:62px;width:40px;height:40px;border:0;padding:0;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(10,10,14,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);cursor:pointer}
.a-mute svg{width:20px;height:20px}
.a-head{margin-top:-62px;gap:16px;align-items:stretch}
.a-head .po{width:146px;border-radius:14px}
.a-head .in{justify-content:flex-end;gap:8px;padding:0 0 2px}
.h-t{display:flex;align-items:flex-start;gap:6px}
.h-t .tp-title{flex:1;min-width:0}
.h-i{flex:none;width:30px;height:30px;margin:-3px -6px 0 0;border:0;padding:0;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.h-i svg{width:22px;height:22px}
.a-head .tp-title{font-size:21px}
.a-head .tp-logo{margin:0}
.h-m{margin:2px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13.5px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.h-m .tp-cert{height:21px;font-size:11.5px}
.h-g{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.h-aw{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.h-aw svg{width:16px;height:16px;flex:none;margin-right:-5px;color:var(--amber)}
.h-aw b{font-weight:700;color:var(--amber)}
:root[data-theme="light"] .h-aw svg,:root[data-theme="light"] .h-aw b{color:#8a5d00}
.a-head .h-row{margin-top:2px}
.a-head .h-row .tp-st{height:28px}
/* the tabs: our segmented control — glass track, the chosen one in amber */
.a-seg{display:flex;gap:2px;margin:20px 20px 0;padding:3px;border-radius:12px;background:rgba(var(--glass),.07)}
.a-seg button{flex:1;min-width:0;height:38px;border:0;padding:0 10px;border-radius:9px;background:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.a-seg button small{font-size:12px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
.a-seg button[aria-selected="true"]{background:var(--amber);color:var(--ink);font-weight:800}
.a-body{padding-top:20px}
.a-body > .tp-rr{margin:18px -20px 0}
.a-body > .tp-my + .tp-rr{margin-top:16px}
.a-body > .tp-rr + .tp-next,.a-body > .tp-rr + .tp-tag,.a-body > .tp-rr + .tp-ov{margin-top:20px}
.a-epv .tp-sec:first-child{margin-top:0}
.a-epv .tp-sh{display:none}
.a-head .tp-st{white-space:nowrap}
.a-head .tp-st small{display:none}
/* round 7 · episodes not out yet: the same countdown as the Upcoming cards — big number, "days" under it */
.tp-cd{flex:none;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.tp-cd b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--heading)}
.tp-cd small{margin-top:3px;font-size:10px;font-weight:600;color:var(--muted)}
.tp-cd.today small{margin:0 0 3px}
.tp-cd.today b,.tp-cd.tba b{font-size:20px;color:var(--accent-fg)}
.tp-cd.tba b{color:var(--muted)}
.w-page .tp-cd{min-width:52px}
.w-page .tp-cd b{font-size:32px}
.w-page .tp-cd small{font-size:11.4px}
.w-page .tp-cd.today b,.w-page .tp-cd.tba b{font-size:24px}

/* ---------- round 8 · app: watchlist + where you are, our tabs, season cards that open, details in "…" ---------- */
.tp-wst{flex:none;display:inline-flex;align-items:center;gap:7px;padding:0 4px 0 2px;font-size:14.5px;font-weight:800;white-space:nowrap}
.tp-wst i{width:8px;height:8px;border-radius:50%;background:currentColor}
.tp-wst.prog{color:var(--accent-fg)}
.tp-wst.done{color:#9B7BFF}
:root[data-theme="light"] .tp-wst.done{color:#6D48E0}
.tp-acts .tp-wst + .tp-main{flex:1}
/* tabs: the Shows page tabs — text, amber underline */
.a-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:20px 20px 0;border-bottom:1px solid var(--line)}
.a-tabs .tab{height:40px;border:0;padding:0;background:none;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .2s}
.a-tabs .tab[aria-selected="true"]{color:var(--accent-fg);font-weight:700}
.a-tabs .ind{position:absolute;left:0;bottom:-1px;width:50%;height:2px;border-radius:2px;background:var(--amber);transition:transform .25s var(--ease)}
.a-tabs .ind.r{transform:translateX(100%)}
/* episodes tab */
.a-eh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.a-eh span{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.a-hide{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:0;border-radius:10px;font-size:13px;font-weight:700;color:var(--text);background:rgba(var(--glass),.08);cursor:pointer}
.a-hide svg{width:17px;height:17px}
.a-hide.on{color:var(--accent-fg);background:rgba(255,196,46,.13)}
:root[data-theme="light"] .a-hide.on{background:rgba(255,196,46,.22)}
.a-ssns{display:flex;flex-direction:column;gap:10px}
.a-ssn{position:relative;overflow:hidden;display:flex;align-items:center;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--glass),.06)}
:root[data-theme="light"] .a-ssn{box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.06)}
.a-ssn .hd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 0 18px 16px;border:0;background:none;text-align:left;cursor:pointer}
.a-ssn .t{display:inline-flex;align-items:center;gap:6px}
.a-ssn .t b{font-family:var(--display);font-size:20px;font-weight:800;color:var(--heading);letter-spacing:-.01em}
.a-ssn .t .cv{width:17px;height:17px;color:var(--muted);transition:transform .25s var(--ease)}
.a-ssn.open .t .cv{transform:rotate(90deg)}
.a-ssn .hd small{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.a-ssn > .tp-ck{margin-right:14px}
.a-ssn .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(var(--glass),.08)}
.a-ssn .bar i{display:block;height:100%;background:var(--amber)}
.a-ssn.done .bar i{background:#9B7BFF}
:root[data-theme="light"] .a-ssn.done .bar i{background:#7B5CF0}
.a-ssns > .tp-eps{margin:2px 0 6px}
/* the app episode card = the website card */
.a-body .tp-ep .im{width:136px}
.tp-ep.hid .im{filter:blur(8px)}
.tp-ep.hid .tx b{color:var(--muted)}
/* "…" sheet carries the details and links now */
.a-sheet .sh-in{max-height:calc(100% - 64px);overflow-y:auto;scrollbar-width:none}
.a-sheet .sh-in::-webkit-scrollbar{display:none}
.tp-mdet{margin-top:10px;padding:14px 6px 0}
.tp-mdet .tp-mh{margin:0 0 12px}
.tp-mdet .tp-facts{margin:0;gap:0}
.tp-mdet .tp-facts div{grid-template-columns:118px minmax(0,1fr);padding:10px 0;border-bottom:1px solid var(--line)}
.tp-mdet .tp-facts div:last-child{border-bottom:0}
.tp-mdet .tp-links{margin-top:16px}

/* ---------- round 9 · the "…" sheet in our system: bottom sheet, grouped cards of 50px rows ---------- */
:root{--sheet:#111217}
:root[data-theme="light"]{--sheet:#f5f5f7}
.a-sheet .sh-in{left:0;right:0;bottom:0;max-height:86%;padding:8px 20px 38px;border-radius:22px 22px 0 0;background:var(--sheet);box-shadow:0 -1px 0 var(--line),0 -20px 60px rgba(0,0,0,.45)}
:root[data-theme="light"] .a-sheet .sh-in{background:var(--sheet);box-shadow:0 -1px 0 var(--line),0 -20px 60px rgba(20,22,30,.18)}
.a-sheet .grab{width:36px;height:5px;margin:0 auto 12px;background:rgba(var(--glass),.22)}
.a-sheet .scrim{background:rgba(0,0,0,.6)}
:root[data-theme="light"] .a-sheet .scrim{background:rgba(20,22,30,.35)}
.tp-sheet{display:flex;flex-direction:column;gap:22px}
.tp-sheet h3{margin:4px 2px -10px;font-family:var(--display);font-size:15.6px;font-weight:800;letter-spacing:.2px;color:var(--heading)}
.tp-sheet .sgrp{display:flex;flex-direction:column;gap:7px}
.tp-sheet .sgrp h2{margin:0 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tp-sheet .scard{background:var(--surface);border-radius:14px;overflow:hidden}
:root[data-theme="light"] .tp-sheet .scard{box-shadow:0 0 0 1px rgba(16,18,27,.06)}
.tp-sheet .scard > * + *{box-shadow:inset 0 1px 0 var(--line)}
.tp-sheet .srow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:9px 14px;border:0;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.tp-sheet .srow:active{background:var(--surface-2)}
.tp-sheet .sic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--accent-fg);background:rgba(255,196,46,.14)}
:root[data-theme="light"] .tp-sheet .sic{background:rgba(255,196,46,.3)}
.tp-sheet .sic svg{width:17px;height:17px}
.tp-sheet .sic.red{color:#FF453A;background:rgba(255,69,58,.14)}
:root[data-theme="light"] .tp-sheet .sic.red{color:#E5242B}
.tp-sheet .stx{flex:1;min-width:0}
.tp-sheet .stx b{font-size:14.5px;font-weight:700}
.tp-sheet .fr{align-items:baseline;cursor:default;gap:16px}
.tp-sheet .fr:active{background:none}
.tp-sheet .fr .k{flex:none;font-size:13.5px;font-weight:500;color:var(--muted)}
.tp-sheet .fr .v{flex:1;min-width:0;text-align:right;font-size:14.5px;font-weight:600;color:var(--text);line-height:1.35}
.tp-sheet .ext{flex:none;font-size:15px;color:var(--accent-fg)}

/* ---------- round 10 · links = the actor page's brand squares; heart = the profile heart; all caught up in green ---------- */
.tp-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tp-links .pw-lk{width:40px;height:40px;padding:0;border-radius:12px;display:grid;place-items:center;letter-spacing:0;text-transform:none;transition:transform .12s,filter .2s;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.tp-links .pw-lk:active{transform:scale(.94)}
@media (hover:hover){.tp-links .pw-lk:hover{filter:brightness(1.08)}}
.pw-lk.imdb{background:#F5C518}
.pw-lk.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.pw-lk.x{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.pw-lk.web{background:#2b2d36;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
.pw-lk.fb{background:#1877F2}
.pw-lk.wd{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.1) inset}
.a-body .tp-links .pw-lk,.tp-sheet .tp-links .pw-lk{width:38px;height:38px;border-radius:11px}
.tp-sheet .tp-links{margin:0;padding:0 2px}
.a-fav.on,.solid .a-fav.on{color:#FF3040}
.tp-wst.ret{color:var(--green)}
/* round 12 · website backdrop: a little soft, so the page reads on top of it */
.w-bd{filter:blur(6px) saturate(1.05)}
/* round 13 · backdrop guard: a veil in the page colour, as strong as the still is bright (dark theme) or dark (light theme) */
.w-bd{clip-path:inset(0)}
.w-dim{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:-64px;height:720px;pointer-events:none;background:linear-gradient(180deg,rgba(var(--bg-rgb),var(--dim,0)) 0%,rgba(var(--bg-rgb),var(--dim,0)) 70%,rgba(var(--bg-rgb),0) 100%);transition:background .4s}

/* round 14 · app: "Details ›" under the overview, opening crew + facts in place */
.tp-dt{display:inline-flex;align-items:center;gap:3px;margin-top:8px;min-height:36px;padding:0;border:0;background:none;color:var(--accent-fg);font-size:15px;font-weight:700;cursor:pointer}
.tp-dt .cv{width:17px;height:17px;transition:transform .25s var(--ease)}
.tp-dt[aria-expanded="true"] .cv{transform:rotate(90deg)}
.tp-inl{margin-top:10px;gap:18px}
.tp-inl .scard{background:var(--surface)}
:root[data-theme="dark"] .tp-inl .scard{background:#121319}

/* round 15 · details open as a plain list (label column + value), seasons redesigned */
.tp-dl{margin:6px 0 0;padding:0}
.tp-dl > div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.tp-dl > div:last-child{border-bottom:0}
.tp-dl dt{font-size:14.5px;font-weight:500;color:var(--muted)}
.tp-dl dd{margin:0;font-size:15.5px;font-weight:600;color:var(--heading);line-height:1.4}
/* season card: artwork-first, progress inside, mark on the right */
.a-ssns{gap:10px}
.a-ssn{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 10px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--glass),.06);overflow:visible}
.a-ssn .hd{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:14px;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.a-ssn .po{flex:none;width:52px;aspect-ratio:2/3;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:14px;font-weight:800;color:var(--muted);background:var(--ph) center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(var(--glass),.1)}
.a-ssn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.a-ssn .t{display:inline-flex;align-items:center;gap:4px}
.a-ssn .t b{font-family:var(--display);font-size:17px;font-weight:800;color:var(--heading);letter-spacing:-.01em}
.a-ssn .t .cv{width:16px;height:16px;color:var(--muted);transition:transform .25s var(--ease)}
.a-ssn.open .t .cv{transform:rotate(90deg)}
.a-ssn .tx > small{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.a-ssn .pg{display:flex;align-items:center;gap:10px;margin-top:5px}
.a-ssn .bar{position:static;flex:1;height:4px;border-radius:2px;background:rgba(var(--glass),.1);overflow:hidden}
.a-ssn .bar i{display:block;height:100%;border-radius:2px;background:var(--amber)}
.a-ssn .pg em{flex:none;font-style:normal;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.a-ssn.prog .pg em{color:var(--accent-fg)}
.a-ssn.done .bar i{background:#9B7BFF}
.a-ssn.done .pg em{color:#9B7BFF}
:root[data-theme="light"] .a-ssn.done .bar i{background:#7B5CF0}
:root[data-theme="light"] .a-ssn.done .pg em{color:#6D48E0}
.a-ssn > .tp-ck{margin:0 0 0 8px}
.tp-dl + .a-eh{margin-top:26px}

/* round 16 · season cards: the poster, blurred behind the card (our episode-card treatment); links live in Details */
.a-ssn{position:relative;isolation:isolate;overflow:hidden}
.a-ssn .bdr{position:absolute;inset:-30px;z-index:-2;background:center/cover no-repeat;filter:blur(18px) saturate(1.2);opacity:.38}
.a-ssn .scr{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(21,22,28,.35) 0%,rgba(21,22,28,.6) 45%,rgba(21,22,28,.78) 100%)}
:root[data-theme="light"] .a-ssn .bdr{opacity:.55}
:root[data-theme="light"] .a-ssn .scr{background:linear-gradient(90deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.6) 45%,rgba(255,255,255,.78) 100%)}
.a-ssn .pg{margin-top:7px}
.a-ssn .bar{background:rgba(var(--glass),.14)}
.tp-dl .lk{align-items:center}
.tp-dl .lk .tp-links{margin:0;gap:8px}
.tp-dl .lk .tp-links .pw-lk{width:36px;height:36px;border-radius:10px}

/* ---------- round 17 · comments (simple, TV Time-style) ---------- */
.tp-cm .tp-sh small{letter-spacing:0;font-size:13px;font-weight:700;text-transform:none}
.cm-add{display:flex;align-items:center;gap:12px;width:100%;height:54px;padding:0 14px 0 10px;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--glass),.08);cursor:text;text-align:left}
.cm-add .ph{flex:1;min-width:0;font-size:15px;color:var(--muted)}
.cm-add .ic{display:flex;gap:12px;color:var(--muted)}
.cm-add .ic svg{width:21px;height:21px}
:root[data-theme="light"] .cm-add{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.08)}
.cm-av{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--ph)}
.cm-av img{width:100%;height:100%;object-fit:cover;display:block}
.cm-av.me{width:34px;height:34px}
.cm-av.sm{width:28px;height:28px}
.cm-av.ini{background:hsl(var(--h) 42% 34%);color:#fff;font-size:15px;font-weight:800}
.cm-av.sm.ini{font-size:12px}
.cm-list{margin-top:6px}
.cm{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:16px 0}
.cm + .cm{border-top:1px solid var(--line)}
.cm-h{display:flex;align-items:center;gap:8px;min-height:22px}
.cm-h b{min-width:0;font-size:14.5px;font-weight:700;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-t{flex:none;font-size:12.5px;font-weight:500;color:var(--muted)}
.cm-dots{flex:none;margin-inline-start:auto;width:28px;height:24px;border:0;padding:0;border-radius:8px;display:grid;place-items:center;background:none;color:var(--muted);cursor:pointer}
.cm-dots svg{width:17px;height:17px}
.cm-x{margin:3px 0 0;font-size:15px;line-height:1.45;color:var(--text);white-space:pre-line;overflow-wrap:anywhere;text-align:start}
.cm-x.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.cm-x.sp{filter:blur(6px);user-select:none;pointer-events:none}
.cm-at{color:var(--accent-fg);font-weight:600}
.cm-mo{display:inline-block;margin-top:4px;padding:0;border:0;background:none;font-size:13.5px;font-weight:700;color:var(--dim);cursor:pointer}
.cm-spb{display:inline-flex;margin-top:6px;height:28px;align-items:center;padding:0 10px;border:0;border-radius:8px;background:rgba(var(--glass),.08);font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer}
.cm-m{position:relative;margin-top:10px;width:min(100%,260px);max-height:240px;border-radius:12px;overflow:hidden;background:var(--ph);box-shadow:inset 0 0 0 1px rgba(var(--glass),.06)}
.cm-m img{display:block;width:100%;height:100%;object-fit:cover}
.cm-m i{position:absolute;left:8px;bottom:8px;height:18px;padding:0 5px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.62)}
.cm-a{display:flex;align-items:center;gap:18px;margin-top:8px}
.cm-a button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.cm-a svg{width:18px;height:18px}
.cm-lk.on{color:#FF3040}
.cm-vr{display:inline-flex;align-items:center;gap:10px;margin-top:8px;height:26px;padding:0;border:0;background:none;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.cm-vr i{width:22px;height:1px;background:currentColor;opacity:.6}
.cm-reps{margin-top:4px}
.cm.rp{grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0 2px;border:0}
.cm.rp .cm-h b{font-size:13.5px}.cm.rp .cm-x{font-size:14.5px}
.cm-all{display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-top:6px;border:0;border-radius:12px;background:rgba(var(--glass),.07);font-size:15px;font-weight:700;color:var(--text);cursor:pointer}
:root[data-theme="light"] .cm-all{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.08)}
.cm-empty{margin:14px 0 0;font-size:14px;color:var(--muted)}
.cm-empty:empty{display:none}
@media (hover:hover){.cm-all:hover{background:rgba(var(--glass),.11)}.cm-a button:hover,.cm-vr:hover,.cm-dots:hover{color:var(--text)}.cm-lk.on:hover{color:#FF3040}}
.w-main .tp-cm{max-width:760px}
.w-main .cm-m{width:min(100%,360px);max-height:380px}
.w-main .cm-all{width:auto;padding:0 22px;display:inline-flex}

/* ---------- round 18 · Comments page ---------- */
.cm-hd{width:100%;border:0;padding:0;background:none;cursor:pointer;text-align:left;align-items:center}
.cm-hd .cv{width:20px;height:20px;margin-inline-start:auto;color:var(--muted)}
.cm-all{gap:6px}.cm-all .cv{width:17px;height:17px;color:var(--muted)}
/* app page */
.phone.cp .a-nav{display:none}
.cp-top{position:absolute;z-index:20;top:0;left:0;right:0;height:104px;padding:56px 10px 0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.cp-top .a-ib{color:var(--text);filter:none}
.cp-tt{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.cp-tt b{font-family:var(--display);font-size:17px;font-weight:800;color:var(--heading)}
.cp-tt small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
:root[data-theme="light"] .phone.cp .sbar{color:#15161c}
.cp-scroll{padding:104px 20px 150px}
.cp-sort{position:relative;display:flex;gap:26px;margin:14px 0 2px;border-bottom:1px solid var(--line)}
.cp-sort button{position:relative;height:42px;padding:0;border:0;background:none;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.cp-sort button[aria-selected="true"]{color:var(--accent-fg);font-weight:800}
.cp-sort button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--amber)}
.cp-end{margin:18px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.cp-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:70px 20px;text-align:center;color:var(--muted)}
.cp-empty svg{width:34px;height:34px;margin-bottom:6px}.cp-empty b{font-size:16px;color:var(--heading)}.cp-empty span{font-size:14px}
/* writing bar */
.cp-box{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;row-gap:6px;align-items:start}
.cp-box textarea{width:100%;min-height:40px;max-height:120px;padding:9px 0;border:0;outline:0;resize:none;background:none;font:inherit;font-size:15px;line-height:1.45;color:var(--text)}
.cp-box textarea::placeholder{color:var(--muted)}
.cp-box .cm-av{margin-top:3px}
.cp-tools{grid-column:2;display:flex;align-items:center;gap:4px}
.cp-tools > button{height:32px;min-width:32px;padding:0 6px;border:0;border-radius:9px;background:none;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:700}
.cp-tools svg{width:21px;height:21px}
.cp-spt{box-shadow:inset 0 0 0 1.2px rgba(var(--glass),.2);padding:0 9px!important}
.cp-spt.on{color:var(--accent-fg)!important;box-shadow:inset 0 0 0 1.2px var(--amber)}
.cp-tools .cp-send{margin-inline-start:auto;width:36px;height:36px;border-radius:11px;background:var(--amber);color:var(--ink)}
.cp-send svg{width:18px;height:18px}
.cp-send:disabled{background:rgba(var(--glass),.1);color:var(--muted);cursor:default}
.phone .cp-box{position:absolute;z-index:25;left:0;right:0;bottom:0;padding:12px 16px 30px;background:var(--bg);border-top:1px solid var(--line)}
/* website page */
.cp-wg{padding-top:40px}
.cp-side{gap:18px}
.cp-st{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:270px}
.cp-st b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;color:var(--heading)}
.cp-back{display:inline-flex;align-items:center;gap:4px;margin-top:6px;height:36px;padding:0 12px 0 6px;border:0;border-radius:10px;background:rgba(var(--glass),.07);font-size:14px;font-weight:700;color:var(--text);cursor:pointer}
.cp-back svg{width:18px;height:18px}
.cp-main{max-width:760px}
.cp-box.big{padding:16px 16px 12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--glass),.08);grid-template-columns:38px minmax(0,1fr)}
.cp-box.big .cm-av{width:38px;height:38px}
.cp-box.big textarea{min-height:64px}
.cp-box.big .cp-send{width:auto;padding:0 18px;font-size:14px;font-weight:800}
:root[data-theme="light"] .cp-box.big{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.08)}
.cp-main .cp-sort{margin-top:22px}
body.cp .w-bd,body.cp .w-sh,body.cp .w-dim{display:none}
@media (hover:hover){.cp-tools > button:not(:disabled):hover{color:var(--text)}.cp-tools .cp-send:not(:disabled):hover{color:var(--ink);filter:brightness(1.06)}.cp-back:hover{background:rgba(var(--glass),.12)}}
@media (max-width:860px){.cp-st{width:auto}}
/* app writing bar: one row at rest; Spoiler appears once you type */
.phone .cp-box{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 30px 14px}
.phone .cp-box .cm-av{margin:0 2px 3px 0}
.phone .cp-box textarea{flex:1;min-width:0;min-height:40px;padding:9px 12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--glass),.08)}
:root[data-theme="light"] .phone .cp-box textarea{background:#fff;box-shadow:0 0 0 1px rgba(16,18,27,.1)}
.phone .cp-tools{display:contents}
.phone .cp-tools > button{margin-bottom:4px}
.phone .cp-tools .cp-send{margin:0 0 2px}
.phone .cp-spt{display:none!important}
.phone .cp-box.typing{flex-wrap:wrap}
.phone .cp-box.typing .cp-spt{display:inline-grid!important}
.phone .cp-box.typing{flex-wrap:nowrap}
.phone .cp-box.typing .cp-tools > button:not(.cp-spt):not(.cp-send){display:none}

/* r19: horizontal rails clip the hover lift (overflow-x:auto forces overflow-y to clip) — give them room above and below */
.w-main .tp-cast,.w-main .tp-recs,.w-main .tp-gal,.w-main .tp-vids{padding-top:10px;margin-top:-10px;padding-bottom:12px;margin-bottom:-8px}
/* r19 · season cards without posters: a number tile coloured by where you are, title, progress, check */
.a-ssn{padding:14px;align-items:center;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--glass),.07)}
:root[data-theme="light"] .a-ssn{background:#fff;box-shadow:0 1px 2px rgba(20,22,30,.06),0 0 0 1px rgba(16,18,27,.07)}
.a-ssn .bdr,.a-ssn .scr{display:none}
.a-ssn .hd{align-items:center;gap:14px}
.a-ssn .no{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--muted);background:rgba(var(--glass),.06);box-shadow:inset 0 0 0 1px rgba(var(--glass),.08);font-variant-numeric:tabular-nums}
.a-ssn.prog .no{color:#ffc42e;background:rgba(255,196,46,.13);box-shadow:inset 0 0 0 1px rgba(255,196,46,.28)}
.a-ssn.done .no{color:#B7A0FF;background:rgba(155,123,255,.15);box-shadow:inset 0 0 0 1px rgba(155,123,255,.3)}
:root[data-theme="light"] .a-ssn.prog .no{color:#8a5d00;background:rgba(255,196,46,.2);box-shadow:inset 0 0 0 1px rgba(200,140,0,.25)}
:root[data-theme="light"] .a-ssn.done .no{color:#6D48E0;background:rgba(109,72,224,.1);box-shadow:inset 0 0 0 1px rgba(109,72,224,.22)}
.a-ssn .tx{justify-content:center;padding:0;gap:3px}
.a-ssn .t b{font-size:17px}
.a-ssn .tx > small{font-size:13px}
.a-ssn .pg{margin-top:8px;gap:10px}
.a-ssn .bar{height:4px}
.a-ssn .pg em{min-width:34px;text-align:right}
.a-ssn > .tp-ck{align-self:center;margin:0 0 0 12px}
/* r19 · selected "done" season chip: our completed-purple tint (like the Ended badge), not a solid lilac block */
.tp-seas .done[aria-selected="true"]{color:#B7A0FF;background:rgba(155,123,255,.22);box-shadow:inset 0 0 0 1.5px #9B7BFF}
.tp-seas .done[aria-selected="true"] i{background:#9B7BFF}
:root[data-theme="light"] .tp-seas .done[aria-selected="true"]{color:#5B36D6;background:rgba(109,72,224,.14);box-shadow:inset 0 0 0 1.5px #6D48E0}
:root[data-theme="light"] .tp-seas .done[aria-selected="true"] i{background:#6D48E0}
/* r19 · web: the same "Hide titles" switch as the app, beside Mark season */
.tp-sm .tp-hide{margin-left:auto;color:var(--text);background:rgba(var(--glass),.09)}
.tp-sm .tp-hide + button{margin-left:0}
.tp-sm .tp-hide.on{color:var(--accent-fg);background:rgba(255,196,46,.13)}
:root[data-theme="light"] .tp-sm .tp-hide.on{background:rgba(255,196,46,.22)}
</style></head>
